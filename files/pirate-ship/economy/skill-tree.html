<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goods on the skill trees</title>
<style>
  :root {
    --bg: #f6f3ec; --panel: #fffdf8; --ink: #22201c; --muted: #6b665c; --line: #d9d3c6;
    --gather: #2f6f4e; --craft: #8a4b1f; --off: #9a8f7a; --accent: #b23a2a;
    --novice: #e9e4d6; --apprentice: #d6e6da; --journeyman: #c3d9d2; --expert: #a9c6bf; --master: #e8c9a0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1a17; --panel: #24221e; --ink: #ece7db; --muted: #a39b8c; --line: #3b3831;
      --gather: #7fc7a0; --craft: #e0a06a; --off: #7d7566; --accent: #e8705f;
      --novice: #2d2b26; --apprentice: #263a30; --journeyman: #27433d; --expert: #2b524b; --master: #4d3b22;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1a17; --panel: #24221e; --ink: #ece7db; --muted: #a39b8c; --line: #3b3831;
    --gather: #7fc7a0; --craft: #e0a06a; --off: #7d7566; --accent: #e8705f;
    --novice: #2d2b26; --apprentice: #263a30; --journeyman: #27433d; --expert: #2b524b; --master: #4d3b22;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 Georgia, "Times New Roman", serif; }
  header { padding: 20px 16px 8px; max-width: 1400px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 12px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 8px; }
  .controls label { cursor: pointer; }
  .bands { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; }
  .band-key { display: flex; align-items: baseline; gap: 6px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
  .band-key b { font-size: 13px; }
  .band-key span { color: var(--muted); font-size: 12px; }
  main { max-width: 1400px; margin: 0 auto; padding: 8px 16px 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .group h2 { font-size: 18px; margin: 8px 0 4px; }
  .group.gathering h2 { color: var(--gather); }
  .group.crafting h2 { color: var(--craft); }
  .group p.note { color: var(--muted); margin: 0 0 10px; font-size: 13px; }
  .skill { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
  .skill h3 { margin: 0; font-size: 17px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .skill h3 .tag { font: 11px/1 system-ui, sans-serif; letter-spacing: .04em; text-transform: uppercase; padding: 3px 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
  .skill .covers { color: var(--muted); font-size: 13px; margin: 2px 0 6px; }
  .skill .why { font-size: 13px; margin: 0 0 8px; }
  .tiers { display: grid; grid-template-columns: 96px 1fr; gap: 2px 8px; }
  .tier-name { font: 12px/1.3 system-ui, sans-serif; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding-top: 6px; }
  .tier-row { min-height: 28px; display: flex; flex-wrap: wrap; gap: 4px; padding: 3px 4px; border-radius: 4px; }
  .tier-row.novice { background: var(--novice); } .tier-row.apprentice { background: var(--apprentice); }
  .tier-row.journeyman { background: var(--journeyman); } .tier-row.expert { background: var(--expert); } .tier-row.master { background: var(--master); }
  .chip { font: 13px/1.2 system-ui, sans-serif; padding: 4px 8px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); cursor: pointer; }
  .chip.off { border-style: dashed; color: var(--off); }
  .chip.hit { outline: 2px solid var(--accent); }
  .chip.dim { opacity: .35; }
  .chip .row { color: var(--muted); font-size: 11px; margin-left: 4px; }
  .detail { position: sticky; bottom: 0; background: var(--panel); border-top: 2px solid var(--line); padding: 10px 16px; max-width: 1400px; margin: 0 auto; font-size: 14px; min-height: 48px; }
  .detail b { font-size: 15px; }
  .detail .muted { color: var(--muted); }
  .notree { grid-column: 1 / -1; }
  .notree ul { margin: 4px 0 0 18px; }
  .count { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Goods on the skill trees</h1>
  <p class="sub" id="status"></p>
  <div class="controls">
    <label><input type="checkbox" id="showOff" checked> show goods made off-map (dashed)</label>
    <label><input type="checkbox" id="showChains" checked> click a good to light its chain</label>
    <span class="count" id="count"></span>
  </div>
  <div class="bands" id="bands"></div>
</header>
<main id="main"></main>
<div class="detail" id="detail"><span class="muted">Click a good to see why it sits where it does, and what it needs.</span></div>
<script id="data" type="application/json">{"title": "Pirate Ship: goods on the skill trees (proposed)", "status": "proposed, 2026-10-28; every placement is for Rex to confirm, move or cut", "bands": [{"key": "novice", "name": "Novice", "range": "0–24", "period": "no trade grade; a labourer or a 'landsman' at sea (the sea grades date from 1652)"}, {"key": "apprentice", "name": "Apprentice", "range": "25–49", "period": "the guild grade: bound seven years, usually from 14 to 21 (Statute of Artificers; secondary summaries)"}, {"key": "journeyman", "name": "Journeyman", "range": "50–74", "period": "the guild grade: out of his time, free of the company, works for day wages (Campbell 1747)"}, {"key": "expert", "name": "Expert", "range": "75–99", "period": "no guild grade; the nearest is the 'able seaman', at least five years at sea (TNA). 'Head boiler' appears only in 1750s Jamaica, later than the period"}, {"key": "master", "name": "Master", "range": "100", "period": "the guild grade: keeps a shop and apprentices; liveryman above it"}], "flags": {"offMap": "made outside the game's Caribbean in this period (Europe, Asia, Africa, the Spanish mainland); the skill tree says where it would sit if a town ever makes it", "input": "needs a good from another skill (the chain the economy follows)"}, "groups": [{"key": "gathering", "name": "Gathering", "note": "Skills that take goods from land and sea. Raw goods come from here.", "skills": [{"key": "farming", "name": "Farming", "existing": false, "covers": "planting, harvest, curing and packing crops; livestock; salt raking; dye-making from the crop (indigo vats, cochineal rearing)", "why": "Every plantation crop is farm work. Dye-making stays here because the indigo vats stood on the plantation (Ligon, Dampier) and cochineal is an insect reared on cactus (COC).", "items": [{"good": 25, "name": "Pease", "band": "novice", "note": "a field crop any hand could grow and pick"}, {"good": 44, "name": "Grain for meal and flour", "band": "n ild cattle, hogs and deer; hides and tallow; the hunters' own smoking and salting (boucan); tanning", "why": "Exquemelin's hunters took hides, tallow and meat and cured it themselves (E2). Tanning is folded in: it was a one-off here.", "items": [{"good": 16, "name": "Hides", "band": "novice", "note": "the kill and the flaying; Spanish Hispaniola 'exercising no other traffic' (E2)"}, {"good": 17, "name": "Tallow", "band": "novice", "note": "rendering the fat; sold with the hides (E2)"}, {"good": 32, "name": "Deerskins", "band": "apprentice", "note": "Carolina's trade with the Indian nations (CCR)"}, {"good": 61, "name": "Boucan and salted boar", "band": "apprentice", "note": "smoked on the boucan frame; the hunters' own craft (E2)"}, {"good": 16, "name": "Tanned leather", "band": "journeyman", "note": "tanning folded in; a separate skill only if the game makes leather goods"}, {"good": 57, "name": "Ivory", "band": "journeyman", "offMap": true, "note": "'Elephant's Teeth' from the Guinea coast (J)"}]}, {"key": "fishing", "name": "Fishing", "existing": true, "covers": "the catch; the salt-fish cure on the beach; turtling; diving for pearls and shell", "why": "Already a skill with its own minigame. Turtling goes here, not Hunting: Dampier's turtlers worked from sloops at sea (D). Pearl diving goes here rather than Swimming because it is a fishery.", "items": [{"good": 60, "name": "Fresh fish", "band": "novice", "note": "the minigame's catch"}, {"good": 24, "name": "Salt fish", "band": "apprentice", "note": "split, salted and dried on the flakes; the poor grade went to the islands (HV)"}, {"good": 60, "name": "Turtle, live", "band": "apprentice", "note": "netted at the Caymans and kept alive in crawls at Port Royal (D, HA)"}, {"good": 15, "name": "Tortoise shell", "band": "journeyman", "note": "the hawksbill's plates, lifted with heat (open: method not sourced)"}, {"good": 52, "name": "Pearls", "band": "expert", "note": "diving the Rancheria banks; a Dutch pearl vessel was worth 100,000 pieces of eight (E)"}, {"good": 55, "name": "Cowries", "band": "novice", "offMap": true, "note": "gathered in the Maldives; a currency, not a craft (UWF)"}]}, {"key": "woodcutting", "name": "Woodcutting", "existing": false, "covers": "felling, riving and squaring timber; the dyewood camps; tar, pitch and turpentine from the pine woods", "why": "Logwood, lumber and naval stores all came out of the woods. Tar burning is folded in: the kilns stood in the forest and the same hands worked them (SCN).", "items": [{"good": 28, "name": "Lumber (felled)", "band": "novice", "note": "felling and hauling; any hand with an axe"}, {"good": 12, "name": "Logwood", "band": "apprentice", "note": "cut and chipped at the Campeche camps, sold at £5 a ton in goods (DV)"}, {"good": 28, "name": "Staves and hoops (rived)", "band": "apprentice", "note": "riving stave bolts for the cooper; Connecticut's cargo to Barbados (CT)"}, {"good": 29, "name": "Shingles", "band": "apprentice", "note": "rived and shaved; late evidence only (CTH)"}, {"good": 13, "name": "Other dyewoods, lignum vitae", "band": "apprentice", "note": "as logwood; fustic and brazeletto in the 1681 return (C81)"}, {"good": 31, "name": "Tar, pitch, turpentine", "band": "journeyman", "note": "the kiln burn takes judgement; 40,000 barrels a year by 1720 (SCN)"}, {"good": 14, "name": "Mahogany", "band": "journeyman", "note": "choosing, felling and squaring the great logs; 'bulky and relatively light' (MH)"}]}, {"key": "mining", "name": "Mining", "existing": false, "covers": "ore, the furnace and the forge that makes bar metal; silver refining", "why": "Smelting sits here with the mine, not with the smith: the smith buys bar iron. Nearly all of it is off-map in this period (Spanish silver, Swedish and Bilbao iron).", "items": [{"good": 36, "name": "Ore and lead", "band": "apprentice", "offMap": true, "note": "lead for shot; no Caribbean mine in the sources"}, {"good": 36, "name": "Bar iron", "band": "journeyman", "offMap": true, "note": "£16 10s–£18 a ton in London (TR); 'voyage iron' to Africa (JS)"}, {"good": 36, "name": "Brass, pewter, steel", "band": "expert", "offMap": true, "note": "alloying and steeling; European works"}, {"good": 49, "name": "Silver", "band": "expert", "offMap": true, "note": "Potosí to Portobelo; refining with mercury (WHF)"}, {"good": 50, "name": "Gold and gold dust", "band": "journeyman", "offMap": true, "note": "Brazil and the Guinea coast; washing dust takes less than refining silver"}]}]}, {"key": "crafting", "name": "Crafting", "note": "Skills that turn raw goods into made ones. Each item names the good it needs.", "skills": [{"key": "cooking", "name": "Cooking", "existing": true, "covers": "milling, baking, butchering and salting, dairying, tallow candles, chocolate; the galley", "why": "Already a skill. Every preserved food is folded in: miller, baker, butcher and chandler were separate trades in London but one-offs in a small port, and the game's cook already handles stores (DUTIES).", "items": [{"good": 20, "name": "Flour and meal", "band": "novice", "input": "farming:Grain for meal and flour", "note": "grinding; New York's bolting monopoly guarded the quality (VR)"}, {"good": 18, "name": "Lime juice", "band": "novice", "note": "pressed and casked; 1,512 gallons to London in one month (C81)"}, {"good": 45, "name": "Tallow candles", "band": "apprentice", "input": "hunting:Tallow", "note": "dipping; they fuse in the heat (L)"}, {"good": 21, "name": "Ship's biscuit", "band": "apprentice", "input": "cooking:Flour and meal", "note": "baked hard, twice; 16s a hundredweight (PY)"}, {"good": 22, "name": "Salt beef and pork", "band": "apprentice", "input": "farming:Horses and livestock", "note": "cut, brined and packed in barrel; a short barrel was noticed (PY)"}, {"good": 43, "name": "Cheese and butter", "band": "journeyman", "input": "farming:Horses and livestock", "note": "dairying; spoils in the heat (L), so an off-map import in practice"}, {"good": 11, "name": "Chocolate", "band": "journeyman", "input": "farming:Cacao, sweated and dried", "note": "roasting and grinding the nut; a Spanish taste first"}]}, {"key": "sugar-boiling", "name": "Sugar boiling", "existing": false, "covers": "the mill and the boiling house: molasses, muscovado, clayed sugar, loaf sugar", "why": "The biggest cash crop. Ligon's boiler judges when to strike the sugar by eye and hand; a head boiler was the most valued man on a plantation. One-off nowhere: every sugar island needs it.", "items": [{"good": 4, "name": "Molasses", "band": "apprentice", "input": "farming:Sugar cane", "note": "what drains from the pots; the apprentice's share of the work (L)"}, {"good": 1, "name": "Muscovado sugar", "band": "journeyman", "input": "farming:Sugar cane", "note": "boiling through the coppers and striking; 3d a pound on Barbados (L)"}, {"good": 2, "name": "Clayed (white) sugar", "band": "expert", "input": "sugar-boiling:Muscovado sugar", "note": "claying the pot so the molasses drains out; 20d a pound in London (L)"}, {"good": 3, "name": "Loaf sugar", "band": "master", "offMap": true, "input": "sugar-boiling:Muscovado sugar", "note": "refined in Bristol and London cone moulds (DB1)"}]}, {"key": "distilling", "name": "Distilling", "existing": false, "covers": "the still and the brewhouse: rum, aqua vitae, brandy; beer and wine folded in", "why": "Rex's own example. Brewing and winemaking are folded in as one-offs: no Caribbean town made wine or much beer in the sources, so they sit here off-map.", "items": [{"good": 42, "name": "Beer", "band": "apprentice", "offMap": true, "input": "farming:Grain for meal and flour", "note": "'good English Beer' shipped out (L)"}, {"good": 18, "name": "Aqua vitae (kill-devil)", "band": "apprentice", "input": "sugar-boiling:Molasses", "note": "the rough first spirit from the skimmings (L)"}, {"good": 5, "name": "Rum", "band": "journeyman", "input": "sugar-boiling:Molasses", "note": "half a crown a gallon on Barbado R wreck (QAR)"}]}, {"key": "carpentry", "name": "Carpentry", "existing": true, "covers": "sawn timber and joinery; the ship's repairs (DUTIES)", "why": "Already a skill, mostly for repairs. Its goods are few: the raw timber comes from Woodcutting and casks are Cooperage.", "items": [{"good": 28, "name": "Planks and boards (sawn)", "band": "novice", "input": "woodcutting:Lumber (felled)", "note": "the saw pit"}, {"good": 14, "name": "Mahogany, worked", "band": "journeyman", "input": "woodcutting:Mahogany", "note": "joinery; the 1720s furniture trade (MH)"}]}, {"key": "cooperage", "name": "Cooperage", "existing": true, "covers": "casks: slack (dry) work for flour and sugar, tight (wet) work for rum, molasses and wine", "why": "Already a skill, and the trade had a real ladder: a slack cooper made dry casks, a tight cooper the harder wet ones. About half the goods travel in its casks (3b).", "items": [{"good": 28, "name": "Staves and heads, dressed", "band": "apprentice", "input": "woodcutting:Staves and hoops (rived)", "note": "jointing and hollowing the staves"}, {"good": 20, "name": "Slack casks (barrel, hogshead for dry goods)", "band": "journeyman", "input": "cooperage:Staves and heads, dressed", "note": "flour barrels, sugar hogsheads; 196 lb of flour to the barrel (FL)"}, {"good": 5, "name": "Tight casks (rum, molasses, wine)", "band": "expert", "input": "cooperage:Staves and heads, dressed", "note": "must hold liquid; a leaking cask loses the rum (DUTIES)"}]}, {"key": "weaving", "name": "Weaving", "existing": false, "covers": "spinning and weaving; rope; tailoring; dyeing the cloth", "why": "Cloth, canvas and cordage were the naval stores pirates took most (Part 2). Ropemaking and tailoring are folded in as one-offs. Nearly all of it is off-map: the colonies imported cloth (L, BR).", "items": [{"good": 46, "name": "Cordage and cable", "band": "apprentice", "offMap": true, "note": "the ropewalk; 'two Cables, and several Coils of Rope' taken (J)"}, {"good": 33, "name": "Coarse linen (dowlas, osnaburg)", "band": "apprentice", "offMap": true, "note": "1s 5d–1s 8d an ell (TR); slaves' and servants' cloth"}, {"good": 35, "name": "Clothing", "band": "apprentice", "input": "weaving:Coarse linen (dowlas, osnaburg)", "note": "tailoring folded in; a shirt at 2s 6d (CSP)"}, {"good": 46, "name": "Sailcloth and canvas", "band": "journeyman", "offMap": true, "note": "the sailmaker sews it; the weaver makes it"}, {"good": 33, "name": "Woollens (broadcloth, duffels)", "band": "journeyman", "offMap": true, "note": "10s–23s 6d a yard (TR); duffels for the Indian trade (CSP)"}, {"good": 33, "name": "Dyed cloth", "band": "journeyman", "offMap": true, "input": "farming:Indigo", "note": "the dyer's vat; indigo and cochineal are the dyes"}, {"good": 33, "name": "Fine linen (holland)", "band": "expert", "offMap": true, "note": "2s 4d–2s 8d a yard (TR)"}, {"good": 34, "name": "Silk, chintz, muslin", "band": "master", "offMap": true, "note": "Asian looms; chintzes in a French prize (J)"}]}, {"key": "medicine", "name": "Surgery and medicine", "existing": true, "covers": "the apothecary's medicines and the surgeon's chest", "why": "Already a skill. Apothecary work is folded in: a town with a surgeon has its medicines from the same hands.", "items": [{"good": 48, "name": "Simple medicines", "band": "journeyman", "note": "the apothecary's stock; 'some of the Ship's Medicines' pressed (J)"}, {"good": 48, "name": "Surgeon's chest and instruments", "band": "expert", "note": "£300–400 at Charleston (J); 200–250 pieces of eight as a fixed share (E)"}]}]}], "noTree": [{"good": 39, "name": "Gunpowder", "note": "powder mills were a trade of their own in Europe; nothing in the sources makes it in the Caribbean. Imported only, or Smithing master if Rex wants a town to make it"}, {"good": 53, "name": "Enslaved people", "note": "Open for Rex, item 1"}, {"good": 54, "name": "Voyage iron", "note": "the same bar iron as Mining: Bar iron, sold as currency on the African coast"}, {"good": 58, "name": "Africa trade cargo", "note": "a mix of the goods above, not a good"}], "bandsSource": "research-trade-grades.md (shared notes folder): guild ladder, sea ranks, Ligon's overseers and tradesmen; 'novice' and 'expert' found as no grade"}</script>

  for (const g of data.groups) {
    const sec = document.createElement('section'); sec.className = 'group ' + g.key;
    sec.innerHTML = '<h2>' + g.name + '</h2><p class="note">' + g.note + '</p>';
    for (const s of g.skills) {
      const card = document.createElement('div'); card.className = 'skill';
      card.innerHTML = '<h3>' + s.name + '<span class="tag">' + (s.existing ? 'in STATS.md' : 'new') + '</span></h3>'
        + '<div class="covers">' + s.covers + '</div><p class="why">' + s.why + '</p>';
      const tiers = document.createElement('div'); tiers.className = 'tiers';
      for (const b of bands) {
        const name = document.createElement('div'); name.className = 'tier-name'; name.textContent = b.name;
        const row = document.createElement('div'); row.className = 'tier-row ' + b.key;
        for (const it of s.items.filter(i => i.band === b.key)) {
          const c = document.createElement('button'); c.type = 'button';
          c.className = 'chip' + (it.offMap ? ' off' : '');
          c.innerHTML = it.name + '<span class="row">#' + it.good + '</span>';
          const key = s.key + ':' + it.name;
          c.dataset.key = key; it._skill = s; it._band = b;
          byKey.set(key, { it, c });
          c.addEventListener('click', () => select(key));
          row.appendChild(c); chips.push({ it, c }); total++; if (it.offMap) off++;
        }
        tiers.appendChild(name); tiers.appendChild(row);
      }
      card.appendChild(tiers); sec.appendChild(card);
    }
    main.appendChild(sec);
  }
  const nt = document.createElement('section'); nt.className = 'group notree';
  nt.innerHTML = '<h2>No tree</h2><p class="note">Goods no skill makes in the game.</p><ul>'
    + data.noTree.map(n => '<li><b>' + n.name + '</b> <span class="count">#' + n.good + '</span>: ' + n.note + '</li>').join('') + '</ul>';
  main.appendChild(nt);
  document.getElementById('count').textContent = total + ' placements, ' + off + ' off-map, ' + data.noTree.length + ' without a tree';

  function up(key, acc) {
    if (acc.has(key)) return acc; acc.add(key);
    const e = byKey.get(key); if (e && e.it.input) up(e.it.input, acc);
    return acc;
  }
  function down(key, acc) {
    if (acc.has(key)) return acc; acc.add(key);
    for (const [k, v] of byKey) if (v.it.input === key) down(k, acc);
    return acc;
  }
  function chainOf(key, acc) { up(key, acc); return down(key, acc); }
  function select(key) {
    const e = byKey.get(key); if (!e) return;
    const it = e.it, s = it._skill, b = it._band;
    const inp = it.input ? byKey.get(it.input) : null;
    const uses = [...byKey.values()].filter(v => v.it.input === key).map(v => v.it._skill.name + ': ' + v.it.name);
    document.getElementById('detail').innerHTML =
      '<b>' + it.name + '</b> <span class="muted">(GOODS.md row ' + it.good + ')</span> · ' + s.name + ', ' + b.name + ' ' + b.range
      + (it.offMap ? ' · <span class="muted">off-map in this period</span>' : '')
      + '<br>' + it.note
      + (inp ? '<br><span class="muted">needs:</span> ' + inp.it._skill.name + ': ' + inp.it.name : (it.input ? '<br><span class="muted">needs:</span> ' + it.input : ''))
      + (uses.length ? '<br><span class="muted">used by:</span> ' + uses.join('; ') : '');
    const chains = document.getElementById('showChains').checked;
    const lit = chains ? chainOf(key, new Set()) : new Set([key]);
    for (const { c } of chips) { c.classList.toggle('hit', lit.has(c.dataset.key)); c.classList.toggle('dim', chains && !lit.has(c.dataset.key)); }
  }
  document.getElementById('showOff').addEventListener('change', ev => {
    for (const { it, c } of chips) if (it.offMap) c.style.display = ev.target.checked ? '' : 'none';
  });
  document.getElementById('main').addEventListener('click', ev => {
    if (ev.target === main || ev.target.closest('.tier-row') === null && !ev.target.closest('.chip')) {
      for (const { c } of chips) { c.classList.remove('hit', 'dim'); }
    }
  });
})();
</script>
</body>
</html>
