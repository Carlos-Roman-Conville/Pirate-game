<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goods on the skill trees</title>
<style>
  :root {
    --bg: #f6f3ec; --panel: #fffdf8; --ink: #22201c; --muted: #6b665c; --line: #d9d3c6;
    --gather: #2f6f4e; --craft: #8a4b1f; --off: #9a8f7a; --accent: #b23a2a;
    --novice: #e9e4d6; --apprentice: #d6e6da; --journeyman: #c3d9d2; --expert: #a9c6bf; --master: #e8c9a0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1a17; --panel: #24221e; --ink: #ece7db; --muted: #a39b8c; --line: #3b3831;
      --gather: #7fc7a0; --craft: #e0a06a; --off: #7d7566; --accent: #e8705f;
      --novice: #2d2b26; --apprentice: #263a30; --journeyman: #27433d; --expert: #2b524b; --master: #4d3b22;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1a17; --panel: #24221e; --ink: #ece7db; --muted: #a39b8c; --line: #3b3831;
    --gather: #7fc7a0; --craft: #e0a06a; --off: #7d7566; --accent: #e8705f;
    --novice: #2d2b26; --apprentice: #263a30; --journeyman: #27433d; --expert: #2b524b; --master: #4d3b22;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 Georgia, "Times New Roman", serif; }
  header { padding: 20px 16px 8px; max-width: 1400px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 12px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 8px; }
  .controls label { cursor: pointer; }
  .bands { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; }
  .band-key { display: flex; align-items: baseline; gap: 6px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
  .band-key b { font-size: 13px; }
  .band-key span { color: var(--muted); font-size: 12px; }
  main { max-width: 1400px; margin: 0 auto; padding: 8px 16px 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .group h2 { font-size: 18px; margin: 8px 0 4px; }
  .group.gathering h2 { color: var(--gather); }
  .group.crafting h2 { color: var(--craft); }
  .group p.note { color: var(--muted); margin: 0 0 10px; font-size: 13px; }
  .skill { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
  .skill h3 { margin: 0; font-size: 17px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .skill h3 .tag { font: 11px/1 system-ui, sans-serif; letter-spacing: .04em; text-transform: uppercase; padding: 3px 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
  .skill .covers { color: var(--muted); font-size: 13px; margin: 2px 0 6px; }
  .skill .why { font-size: 13px; margin: 0 0 8px; }
  .tiers { display: grid; grid-template-columns: 96px 1fr; gap: 2px 8px; }
  .tier-name { font: 12px/1.3 system-ui, sans-serif; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding-top: 6px; }
  .tier-row { min-height: 28px; display: flex; flex-wrap: wrap; gap: 4px; padding: 3px 4px; border-radius: 4px; }
  .tier-row.novice { background: var(--novice); } .tier-row.apprentice { background: var(--apprentice); }
  .tier-row.journeyman { background: var(--journeyman); } .tier-row.expert { background: var(--expert); } .tier-row.master { background: var(--master); }
  .chip { font: 13px/1.2 system-ui, sans-serif; padding: 4px 8px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); cursor: pointer; }
  .chip.off { border-style: dashed; color: var(--off); }
  .chip.unsourced { border-style: dotted; border-color: var(--accent); }
  .chip.hit { outline: 2px solid var(--accent); }
  .chip.dim { opacity: .35; }
  .chip .row { color: var(--muted); font-size: 11px; margin-left: 4px; }
  .detail { position: sticky; bottom: 0; background: var(--panel); border-top: 2px solid var(--line); padding: 10px 16px; max-width: 1400px; margin: 0 auto; font-size: 14px; min-height: 48px; }
  .detail b { font-size: 15px; }
  .detail .muted { color: var(--muted); }
  .notree { grid-column: 1 / -1; }
  .notree ul { margin: 4px 0 0 18px; }
  .count { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Goods on the skill trees</h1>
  <p class="sub" id="status"></p>

    <label><input type="checkbox" id="showOff" checked> show goods made off-map (dashed)</label>
    <span class="count">dotted red = Rex's addition, no period source</span>
    <label><input type="checkbox" id="showChains" checked> click a good to light its chain</label>
    <span class="count" id="count"></span>
  </div>
  <div class="bands" id="bands"></div>
</header>
<main id="main"></main>
<div class="detail" id="detail"><span class="muted">Click a good to see why it sits where it does, and what it needs.</span></div>
<script id="data" type="application/json">{"title": "Pirate Ship: goods on the skill trees (proposed)", "status": "Rex's splits of 2026-10-28 applied (Farming group; Cooking into Milling, Baking, Butchering, Preserving, Dairying, Waxworking; Tanning apart; Leatherworking added); placements still proposed", "bands": [{"key": "novice", "name": "Novice", "range": "0–24", "period": "no trade grade; a labourer or a 'landsman' at sea (the sea grades date from 1652)"}, {"key": "apprentice", "name": "Apprentice", "range": "25–49", "period": "the guild grade: bound seven years, usually from 14 to 21 (Statute of Artificers; secondary summaries)"}, {"key": "journeyman", "name": "Journeyman", "range": "50–74", "period": "the guild grade: out of his time, free of the company, works for day wages (Campbell 1747)"}, {"key": "expert", "name": "Expert", "range": "75–99", "period": "no guild grade; the nearest is the 'able seaman', at least five years at sea (TNA). 'Head boiler' appears only in 1750s Jamaica, later than the period"}, {"key": "master", "name": "Master", "range": "100", "period": "the guild grade: keeps a shop and apprentices; liveryman above it"}], "flags": {"offMap": "made outside the game's Caribbean in this period (Europe, Asia, Africa, the Spanish mainland); the skill tree says where it would sit if a town ever makes it", "input": "needs a good from another skill (the chain the economy follows)", "gate": "needs another skill at some level to reach the place (Swimming for depth); that skill makes nothing", "unsourced": "Rex's addition with no period source found; a design good, not a historical record"}, "groups": [{"key": "gathering", "name": "Gathering", "note": "Skills that take goods from land and sea. Raw goods come from here. Swimming is a gate for depth, not a goods skill.", "skills": [{"key": "farming", "name": "Farming", "existing": false, "covers": "planting, harvest, curing and packing crops; the dye plants and flowers as crops", "why": "Crop cultivation only (Rex, 2026-10-28). Livestock, salt, dye-making and perfume have skills of their own.", "items": [{"good": 25, "name": "Pease", "band": "novice", "note": "a field crop any hand could grow and pick"}, {"good": 44, "name": "Grain for meal and flour", "band": "novice", "note": "planting and reaping; milling is Cooking"}, {"good": 8, "name": "Cotton wool", "band": "apprentice", "note": "picking and ginning before bagging (C81)"}, {"good": 6, "name": "Ginger", "band": "apprentice", "note": "the root is scraped so it stays white and does not sprout (L)"}, {"good": 19, "name": "Tobacco, grown", "band": "apprentice", "note": "topping and suckering the plant; the cure is the harder part"}, {"good": 11, "name": "Cacao, grown", "band": "apprentice", "note": "the tree; Jamaica's crops failed to a 'blast' (PT)"}, {"good": 1, "name": "Sugar cane", "band": "journeyman", "note": "planting, cutting and carting to the mill within a day of cutting (L); the boiling is Sugar boiling"}, {"good": 30, "name": "Rice", "band": "journeyman", "note": "wet-field rice took skill the Carolina planters bought from West Africa (SCR)"}, {"good": 19, "name": "Tobacco, cured and packed", "band": "journeyman", "note": "curing, prizing into the hogshead to at least 800 lb (VA30)"}, {"good": 7, "name": "Pimento", "band": "journeyman", "note": "picked green and sun-dried, kept from the dew (EB78)"}, {"good": 10, "name": "Annatto (seed)", "band": "journeyman", "note": "the crop; the paste is Dye Making (D)"}, {"good": 11, "name": "Cacao, sweated and dried", "band": "journeyman", "note": "sweated under plantain leaves, three or four weeks' sun (PT)"}, {"good": 9, "name": "Indigo plant (grown and cut)", "band": "apprentice", "note": "the crop; the vats are Dye Making"}, {"good": 51, "name": "Nopal and cochineal (reared)", "band": "journeyman", "offMap": true, "note": "the insect reared on the cactus in Oaxaca (COC); the dye is Dye Making"}, {"good": 62, "name": "Aromatic flowers and herbs", "band": "apprentice", "note": "Rex's addition: a crop for Perfumery. No period Caribbean source; marked unsourced", "unsourced": true}]}, {"key": "husbandry", "name": "Animal Husbandry", "existing": false, "covers": "breeding, feeding and keeping livestock; milk, wool, farm hides", "why": "Split from Farming (Rex, 2026-10-28): keeping animals is its own expertise. Wild cattle and hogs stay with Hunting.", "items": [{"good": 27, "name": "Horses", "band": "journeyman", "note": "bred in New England and shipped at about £12 each (PY)"}, {"good": 22, "name": "Cattle and hogs (farm)", "band": "apprentice", "note": "the meat for Cooking's salt beef and pork"}, {"good": 43, "name": "Milk", "band": "apprentice", "note": "for Cooking's cheese and butter"}, {"good": 33, "name": "Wool", "band": "apprentice", "offMap": true, "note": "English sheep; no Caribbean flock in the sources"}, {"good": 60, "name": "Turtle crawls (kept live)", "band": "apprentice", "note": "penned at Port Royal until sold (D); catching them is Fishing"}]}, {"key": "marine", "name": "Marine Gathering", "existing": false, "covers": "the shore and the shallows: salt pans, shells, pearls, seaweed", "why": "Split from Farming (Rex, 2026-10-28). Pearls sit here with a Swimming gate for the depth, not a skill of their own.", "items": [{"good": 59, "name": "Salt (raked)", "band": "novice", "note": "sun does the work; raking the pans was ordinary labour (D, TC)"}, {"good": 52, "name": "Pearls (dived)", "band": "expert", "gate": "Swimming", "note": "the Rancheria banks; needs Swimming for the depth (E)"}, {"good": 15, "name": "Tortoise shell", "band": "journeyman", "note": "the hawksbill's plates (method open)"}, {"good": 55, "name": "Cowries and shells", "band": "novice", "offMap": true, "note": "Maldives shells, a currency (UWF)"}, {"good": 63, "name": "Seaweed", "band": "novice", "note": "Rex's addition; no period trade in the sources, marked unsourced", "unsourced": true}]}, {"key": "hunting", "name": "Hunting", "existing": false, "covers": "tracking and killing wild cattle, hogs, deer; the carcass", "why": "Obtaining the animal only (Rex, 2026-10-28). Skinning is Butchering, curing is Preserving, leather is Tanning. A hunter with low Butchering wastes the carcass.", "items": [{"good": 16, "name": "Wild cattle and hog carcasses", "band": "novice", "note": "Hispaniola's wild herds (E2)"}, {"good": 32, "name": "Deer carcasses", "band": "apprentice", "note": "Carolina's trade with the Indian nations (CCR)"}, {"good": 57, "name": "Ivory", "band": "journeyman", "offMap": true, "note": "'Elephant's Teeth' from the Guinea coast (J)"}]}, {"key": "fishing", "name": "Fishing", "existing": true, "covers": "the catch; turtling at sea", "why": "Already a skill with its own minigame. Turtling is netting at sea from sloops (D), so it stays here; shells and pearls are Marine Gathering.", "items": [{"good": 60, "name": "Fresh fish", "band": "novice", "note": "the minigame's catch"}, {"good": 60, "name": "Turtle, live", "band": "apprentice", "note": "netted at the Caymans and kept alive in crawls at Port Royal (D, HA)"}]}, {"key": "woodcutting", "name": "Woodcutting", "existing": false, "covers": "felling, riving and squaring timber; the dyewood camps; tar, pitch and turpentine from the pine woods", "why": "Logwood, lumber and naval stores all came out of the woods. Tar burning is folded in: the kilns stood in the forest and the same hands worked them (SCN).", "items": [{"good": 28, "name": "Lumber (felled)", "band": "novice", "note": "felling and hauling; any hand with an axe"}, {"good": 12, "name": "Logwood", "band": "apprentice", "note": "cut and chipped at the Campeche camps, sold at £5 a ton in goods (DV)"}, {"good": 28, "name": "Staves and hoops (rived)", "band": "apprentice", "note": "riving stave bolts for the cooper; Connecticut's cargo to Barbados (CT)"}, {"good": 29, "name": "Shingles", "band": "apprentice", "note": "rived and shaved; late evidence only (CTH)"}, {"good": 13, "name": "Other dyewoods, lignum vitae", "band": "apprentice", "note": "as logwood; fustic and brazeletto in the 1681 return (C81)"}, {"good": 31, "name": "Tar, pitch, turpentine", "band": "journeyman", "note": "the kiln burn takes judgement; 40,000 barrels a year by 1720 (SCN)"}, {"good": 14, "name": "Mahogany", "band": "journeyman", "note": "choosing, felling and squaring the great logs; 'bulky and relatively light' (MH)"}]}, {"key": "mining", "name": "Mining", "existing": false, "covers": "ore, the furnace and the forge that makes bar metal; silver refining", "why": "Smelting sits here with the mine, not with the smith: the smith buys bar iron. Nearly all of it is off-map in this period (Spanish silver, Swedish and Bilbao iron).", "items": [{"good": 36, "name": "Ore and lead", "band": "apprentice", "offMap": true, "note": "lead for shot; no Caribbean mine in the sources"}, {"good": 36, "name": "Bar iron", "band": "journeyman", "offMap": true, "note": "£16 10s–£18 a ton in London (TR); 'voyage iron' to Africa (JS)"}, {"good": 36, "name": "Brass, pewter, steel", "band": "expert", "offMap": true, "note": "alloying and steeling; European works"}, {"good": 49, "name": "Silver", "band": "expert", "offMap": true, "note": "Potosí to Portobelo; refining with mercury (WHF)"}, {"good": 50, "name": "Gold and gold dust", "band": "journeyman", "offMap": true, "note": "Brazil and the Guinea coast; washing dust takes less than refining silver"}]}]}, {"key": "crafting", "name": "Crafting", "note": "Skills that turn raw goods into made ones. Each item names the good it needs.", "skills": [{"key": "cooking", "name": "Cooking", "existing": true, "covers": "meals and dishes; the galley; chocolate", "why": "Meals only (Rex, 2026-10-28). Milling, Baking, Butchering, Preserving, Dairying and Waxworking are skills of their own.", "items": [{"good": 18, "name": "Lime juice", "band": "novice", "note": "pressed and casked; 1,512 gallons to London in one month (C81)"}, {"good": 21, "name": "Salmagundi and the hot meal", "band": "apprentice", "input": "preserving:Salt beef and pork", "note": "the one hot meal from the galley (DUTIES); not a traded good"}, {"good": 11, "name": "Chocolate", "band": "journeyman", "input": "farming:Cacao, sweated and dried", "note": "roasting and grinding the nut; a Spanish taste first"}]}, {"key": "milling", "name": "Milling", "existing": false, "covers": "grinding grain to flour and meal; the sugar mill is Sugar boiling", "why": "Its own skill (Rex, 2026-10-28). New York guarded its flour's name with a bolting monopoly (VR).", "items": [{"good": 44, "name": "Meal (coarse)", "band": "novice", "input": "farming:Grain for meal and flour", "note": "'Barrels of meale close put up' (L)"}, {"good": 26, "name": "Oatmeal", "band": "apprentice", "input": "farming:Grain for meal and flour", "note": "Roberts took '10 Casks of Oatmeal' (J)"}, {"good": 20, "name": "Flour (bolted)", "band": "journeyman", "input": "farming:Grain for meal and flour", "note": "bolted fine; 196 lb to the barrel (FL)"}]}, {"key": "baking", "name": "Baking", "existing": false, "covers": "bread and ship's biscuit", "why": "Its own skill (Rex, 2026-10-28). Large quantities of biscuit were baked in the Connecticut Valley and Philadelphia for the islands (PH).", "items": [{"good": 21, "name": "Bread", "band": "novice", "input": "milling:Meal (coarse)", "note": "daily bread; not a cargo"}, {"good": 21, "name": "Ship's biscuit", "band": "apprentice", "input": "milling:Flour (bolted)", "note": "baked hard, twice; 16s a hundredweight (PY); well baked, it keeps for years (SV)"}]}, {"key": "butchering", "name": "Butchering", "existing": false, "covers": "skinning and dividing a carcass: meat, raw hide, fat, bone", "why": "Its own skill (Rex, 2026-10-28): obtaining the animal is Hunting or Animal Husbandry; the carcass is this. Raw hides come from here.", "items": [{"good": 22, "name": "Fresh meat", "band": "novice", "input": "husbandry:Cattle and hogs (farm)", "note": "for the galley and for Preserving"}, {"good": 16, "name": "Raw hides", "band": "apprentice", "input": "hunting:Wild cattle and hog carcasses", "note": "flaying clean; 'cow hides 69 ... buff hides 768' to London (C81)"}, {"good": 17, "name": "Tallow (rendered)", "band": "apprentice", "input": "hunting:Wild cattle and hog carcasses", "note": "the fat rendered; sold with the hides (E2)"}, {"good": 32, "name": "Deerskins (raw)", "band": "journeyman", "input": "hunting:Deer carcasses", "note": "a clean skin is worth more; 'Skinns' from Carolina (CCR)"}]}, {"key": "preserving", "name": "Preserving", "existing": false, "covers": "salting, smoking, drying: meat and fish that keep at sea", "why": "Its own skill (Rex, 2026-10-28). The boucaniers' smoking frame and the salt-fish flakes are the same expertise: keeping food.", "items": [{"good": 24, "name": "Salt fish", "band": "novice", "input": "fishing:Fresh fish", "note": "split, salted and dried; the poor grade went to the islands (HV)"}, {"good": 61, "name": "Boucan (smoked meat)", "band": "apprentice", "input": "butchering:Fresh meat", "note": "hardened with smoke for sea voyages (E2)"}, {"good": 22, "name": "Salt beef and pork", "band": "journeyman", "input": "butchering:Fresh meat", "note": "cut, brined and packed tight in barrel; a short barrel was noticed (PY)"}, {"good": 61, "name": "Salted boar", "band": "journeyman", "input": "butchering:Fresh meat", "note": "'salt it, and sell it so to the planters' (E2)"}]}, {"key": "dairying", "name": "Dairying", "existing": false, "covers": "butter and cheese from milk", "why": "Its own skill (Rex, 2026-10-28). Nearly all of it was off-map: Ligon says butter and cheese from England or Holland often spoil on the way (L).", "items": [{"good": 43, "name": "Butter", "band": "apprentice", "input": "husbandry:Milk", "note": "in firkins; weight open (ML)"}, {"good": 43, "name": "Cheese", "band": "journeyman", "input": "husbandry:Milk", "note": "'a hundred-weight of Gloucester cheese' to Virginia (BR)"}]}, {"key": "waxworking", "name": "Waxworking", "existing": false, "covers": "candles first, then wax seals, moulded and ceremonial candles, wax portraits and figures", "why": "Rex's skill (2026-10-28), renamed from Candlemaking so it has a ladder to Master. Tallow candles are sourced (L); beeswax and wax sculpture were real European trades but nothing in the period Caribbean sources, so those tiers are marked unsourced. Wax sculpture was an artist's trade, not the top of the chandler's; joining them is a design choice.", "items": [{"good": 45, "name": "Tallow candles", "band": "novice", "input": "butchering:Tallow (rendered)", "note": "dipped; they fuse in the heat (L)"}, {"good": 45, "name": "Wax seals", "band": "novice", "unsourced": true, "note": "sealing wax for letters; no Caribbean source"}, {"good": 45, "name": "Beeswax candles", "band": "apprentice", "unsourced": true, "note": "cleaner burning, for church and the cabin; beeswax supply in the Caribbean open"}, {"good": 45, "name": "Moulded and altar candles", "band": "journeyman", "unsourced": true, "note": "consistent sizes, ceremonial forms"}, {"good": 45, "name": "Wax portraits and anatomical models", "band": "expert", "unsourced": true, "note": "a European art of the period; unsourced here"}, {"good": 45, "name": "Lifelike wax figures", "band": "master", "unsourced": true, "note": "the INFP's signature work (story: brothel, wax figures); a design good"}]}, {"key": "tanning", "name": "Tanning", "existing": false, "covers": "raw hide to leather", "why": "Kept apart from Butchering (Rex, 2026-10-28): a butcher skins, a tanner makes leather. Leatherworking makes the goods.", "items": [{"good": 32, "name": "Dressed deerskin", "band": "apprentice", "input": "butchering:Deerskins (raw)", "note": "the Carolina export went raw or half-dressed (open)"}, {"good": 16, "name": "Tanned leather", "band": "journeyman", "input": "butchering:Raw hides", "note": "bark pits take months; no Caribbean tannery in the sources, so off-map in practice"}]}, {"key": "leatherworking", "name": "Leatherworking", "existing": false, "covers": "goods made from leather: sacks and straps, belts and baldrics, shoes and boots, harness and saddles, gloves", "why": "Added by Rex (2026-10-28) after Tanning. Shoes, boots and gloves were imported from England in the period (L), so those sit off-map; the shoemaker (cordwainer) was a seven-year trade. Leather sacks carried indigo (E).", "items": [{"good": 16, "name": "Leather sacks and straps", "band": "novice", "input": "tanning:Tanned leather", "note": "indigo moved in 'leather sacks' at Maracaibo (E)"}, {"good": 38, "name": "Belts, baldrics, scabbards", "band": "apprentice", "input": "tanning:Tanned leather", "note": "for the swords Ligon lists among imports (L); the pirate's gear"}, {"good": 35, "name": "Shoes and boots", "band": "journeyman", "offMap": true, "input": "tanning:Tanned leather", "note": "'shooes, and some bootes' at £50 in Ligon's outfit (L); the cordwainer's trade"}, {"good": 27, "name": "Harness and saddles", "band": "expert", "input": "tanning:Tanned leather", "note": "for the horse trade (PY); no period Caribbean saddler in the sources: open"}, {"good": 35, "name": "Gloves and fine leather", "band": "master", "offMap": true, "input": "tanning:Tanned leather", "note": "'Gloves' among Ligon's imports (L)"}]}, {"key": "sugar-boiling", "name": "Sugar boiling", "existing": false, "covers": "the mill and the boiling house: molasses, muscovado, clayed sugar, loaf sugar", "why": "The biggest cash crop. Ligon's boiler judges when to strike the sugar by eye and hand; a head boiler was the most valued man on a plantation. One-off nowhere: every sugar island needs it.", "items": [{"good": 4, "name": "Molasses", "band": "apprentice", "input": "farming:Sugar cane", "note": "what drains from the pots; the apprentice's share of the work (L)"}, {"good": 1, "name": "Muscovado sugar", "band": "journeyman", "input": "farming:Sugar cane", "note": "boiling through the coppers and striking; 3d a pound on Barbados (L)"}, {"good": 2, "name": "Clayed (white) sugar", "band": "expert", "input": "sugar-boiling:Muscovado sugar", "note": "claying the pot so the molasses drains out; 20d a pound in London (L)"}, {"good": 3, "name": "Loaf sugar", "band": "master", "offMap": true, "input": "sugar-boiling:Muscovado sugar", "note": "refined in Bristol and London cone moulds (DB1)"}]}, {"key": "dye", "name": "Dye Making", "existing": false, "covers": "the vats and the dye bath: indigo, annatto, cochineal; dyeing cloth", "why": "Its own trade (Rex, 2026-10-28): extraction, fermentation, mordants and colour. Farming grows the plant, Dye Making makes the dye and colours the cloth.", "items": [{"good": 10, "name": "Annatto dye", "band": "apprentice", "input": "farming:Annatto (seed)", "note": "seed pulp worked to a paste (D)"}, {"good": 9, "name": "Indigo dye", "band": "journeyman", "input": "farming:Indigo plant (grown and cut)", "note": "steeping, beating and judging the cut (C88, D)"}, {"good": 51, "name": "Cochineal dye", "band": "expert", "offMap": true, "input": "farming:Nopal and cochineal (reared)", "note": "killing and drying the insect; 18–45s a pound in London (TR)"}, {"good": 33, "name": "Dyed cloth", "band": "journeyman", "input": "weaving:Coarse linen (dowlas, osnaburg)", "note": "the dye bath with a mordant; needs a dye from this tree too"}]}, {"key": "distilling", "name": "Distilling", "existing": false, "covers": "the still and the brewhouse: rum, aqua vitae, brandy; beer and wine folded in", "why": "Rex's own example. Brewing and winemaking are folded in as one-offs: no Caribbean town made wine or much beer in the sources, so they sit here off-map.", "items": [{"good": 42, "name": "Beer", "band": "apprentice", "offMap": true, "input": "farming:Grain for meal and flour", "note": "'good English Beer' shipped out (L)"}, {"good": 18, "name": "Aqua vitae (kill-devil)", "band": "apprentice", "input": "sugar-boiling:Molasses", "note": "the rough first spirit from the skimmings (L)"}, {"good": 5, "name": "Rum", "band": "journeyman", "input": "sugar-boiling:Molasses", "note": "half a crown a gallon on Barbados (L); cask size open (1j)"}, {"good": 40, "name": "Wine", "band": "journeyman", "offMap": true, "note": "Madeira, Fayal, Canary, claret: £8 a pipe at Jamestown (CSP)"}, {"good": 41, "name": "Brandy", "band": "expert", "offMap": true, "input": "distilling:Wine", "note": "distilled wine; thirty casks in one prize (J)"}]}, {"key": "perfumery", "name": "Perfumery", "existing": false, "covers": "aromatic extraction, blending, fixing a scent", "why": "Rex's addition (2026-10-28), kept apart from Distilling: a rum distiller is not a perfumer. No Caribbean perfume trade in the period sources; the goods are marked unsourced.", "items": [{"good": 62, "name": "Fragrant oils and waters", "band": "journeyman", "input": "farming:Aromatic flowers and herbs", "note": "unsourced for the Caribbean; a cultural good if one region prizes it", "unsourced": true}, {"good": 62, "name": "Perfume", "band": "expert", "input": "perfumery:Fragrant oils and waters", "note": "unsourced; the finished luxury", "unsourced": true}]}, {"key": "smithing", "name": "Smithing", "existing": true, "covers": "the forge: nails, hoops, tools, blades, shot; gunsmithing at the top", "why": "Already a skill. Gunsmithing is folded in as its top tier rather than a skill of its own. The great guns stay off-map: a foundry, not a forge.", "items": [{"good": 37, "name": "Nails", "band": "novice", "input": "mining:Bar iron", "note": "6d a pound retail (TR); the first thing an apprentice makes"}, {"good": 39, "name": "Shot (cast lead)", "band": "novice", "input": "mining:Ore and lead", "note": "1,281 lead shot in one QAR lab batch (QAR)"}, {"good": 37, "name": "Iron hoops", "band": "apprentice", "input": "mining:Bar iron", "note": "for the cooper; wooden hoops were the cheaper kind"}, {"good": 37, "name": "Tools: hoes, axes, knives", "band": "apprentice", "input": "mining:Bar iron", "note": "'nails, hoes, and axes' to Virginia (BR)"}, {"good": 47, "name": "Small wares: pins, needles, combs", "band": "apprentice", "offMap": true, "note": "Bonnet took 'a few Combs, Pins and Needles' (J)"}, {"good": 56, "name": "Manillas", "band": "apprentice", "offMap": true, "input": "mining:Brass, pewter, steel", "note": "brass currency for the Africa trade; 600 on the Whydah (WBUR)"}, {"good": 38, "name": "Swords and cutlasses", "band": "journeyman", "input": "mining:Brass, pewter, steel", "note": "steel blades; 'Swords, knives' shipped to Barbados (L)"}, {"good": 38, "name": "Muskets and pistols", "band": "expert", "input": "mining:Bar iron", "note": "gunsmithing: lock, stock and barrel"}, {"good": 38, "name": "Great guns (cannon)", "band": "master", "offMap": true, "note": "cast at a foundry; 29 located on the QAR wreck (QAR)"}]}, {"key": "carpentry", "name": "Carpentry", "existing": true, "covers": "sawn timber and joinery; the ship's repairs (DUTIES)", "why": "Already a skill, mostly for repairs. Its goods are few: the raw timber comes from Woodcutting and casks are Cooperage.", "items": [{"good": 28, "name": "Planks and boards (sawn)", "band": "novice", "input": "woodcutting:Lumber (felled)", "note": "the saw pit"}, {"good": 14, "name": "Mahogany, worked", "band": "journeyman", "input": "woodcutting:Mahogany", "note": "joinery; the 1720s furniture trade (MH)"}]}, {"key": "cooperage", "name": "Cooperage", "existing": true, "covers": "casks: slack (dry) work for flour and sugar, tight (wet) work for rum, molasses and wine", "why": "Already a skill, and the trade had a real ladder: a slack cooper made dry casks, a tight cooper the harder wet ones. About half the goods travel in its casks (3b).", "items": [{"good": 28, "name": "Staves and heads, dressed", "band": "apprentice", "input": "woodcutting:Staves and hoops (rived)", "note": "jointing and hollowing the staves"}, {"good": 20, "name": "Slack casks (barrel, hogshead for dry goods)", "band": "journeyman", "input": "cooperage:Staves and heads, dressed", "note": "flour barrels, sugar hogsheads; 196 lb of flour to the barrel (FL)"}, {"good": 5, "name": "Tight casks (rum, molasses, wine)", "band": "expert", "input": "cooperage:Staves and heads, dressed", "note": "must hold liquid; a leaking cask loses the rum (DUTIES)"}]}, {"key": "weaving", "name": "Weaving", "existing": false, "covers": "spinning and weaving; rope; tailoring", "why": "Cloth, canvas and cordage were the naval stores pirates took most (Part 2). Ropemaking and tailoring are folded in as one-offs. Nearly all of it is off-map: the colonies imported cloth (L, BR).", "items": [{"good": 46, "name": "Cordage and cable", "band": "apprentice", "offMap": true, "note": "the ropewalk; 'two Cables, and several Coils of Rope' taken (J)"}, {"good": 33, "name": "Coarse linen (dowlas, osnaburg)", "band": "apprentice", "offMap": true, "note": "1s 5d–1s 8d an ell (TR); slaves' and servants' cloth"}, {"good": 35, "name": "Clothing", "band": "apprentice", "input": "weaving:Coarse linen (dowlas, osnaburg)", "note": "tailoring folded in; a shirt at 2s 6d (CSP)"}, {"good": 46, "name": "Sailcloth and canvas", "band": "journeyman", "offMap": true, "note": "the sailmaker sews it; the weaver makes it"}, {"good": 33, "name": "Woollens (broadcloth, duffels)", "band": "journeyman", "offMap": true, "note": "10s–23s 6d a yard (TR); duffels for the Indian trade (CSP)"}, {"good": 33, "name": "Fine linen (holland)", "band": "expert", "offMap": true, "note": "2s 4d–2s 8d a yard (TR)"}, {"good": 34, "name": "Silk, chintz, muslin", "band": "master", "offMap": true, "note": "Asian looms; chintzes in a French prize (J)"}]}, {"key": "medicine", "name": "Surgery and medicine", "existing": true, "covers": "the apothecary's medicines and the surgeon's chest", "why": "Already a skill. Apothecary work is folded in: a town with a surgeon has its medicines from the same hands.", "items": [{"good": 48, "name": "Simple medicines", "band": "journeyman", "note": "the apothecary's stock; 'some of the Ship's Medicines' pressed (J)"}, {"good": 48, "name": "Surgeon's chest and instruments", "band": "expert", "note": "£300–400 at Charleston (J); 200–250 pieces of eight as a fixed share (E)"}]}]}], "noTree": [{"good": 39, "name": "Gunpowder", "note": "powder mills were a trade of their own in Europe; nothing in the sources makes it in the Caribbean. Imported only, or Smithing master if Rex wants a town to make it"}, {"good": 53, "name": "Enslaved people", "note": "Open for Rex, item 1"}, {"good": 54, "name": "Voyage iron", "note": "the same bar iron as Mining: Bar iron, sold as currency on the African coast"}, {"good": 58, "name": "Africa trade cargo", "note": "a mix of the goods above, not a good"}], "bandsSource": "research-trade-grades.md (shared notes folder): guild ladder, sea ranks, Ligon's overseers and tradesmen; 'novice' and 'expert' found as no grade"}</script>
<script>
(function () {
  const data = JSON.parse(document.getElementById('data').textContent);
  const bands = data.bands;
  const main = document.getElementById('main');
  document.getElementById('status').textContent = data.status;
  const bandsEl = document.getElementById('bands');
  for (const b of bands) {
    const d = document.createElement('div'); d.className = 'band-key';
    d.innerHTML = '<b>' + b.name + ' ' + b.range + '</b><span>' + b.period + '</span>';
    bandsEl.appendChild(d);
  }
  const chips = [];
  const byKey = new Map();
  let total = 0, off = 0;
  for (const g of data.groups) {
    const sec = document.createElement('section'); sec.className = 'group ' + g.key;
    sec.innerHTML = '<h2>' + g.name + '</h2><p class="note">' + g.note + '</p>';
    for (const s of g.skills) {
      const card = document.createElement('div'); card.className = 'skill';
      card.innerHTML = '<h3>' + s.name + '<span class="tag">' + (s.existing ? 'in STATS.md' : 'new') + '</span></h3>'
        + '<div class="covers">' + s.covers + '</div><p class="why">' + s.why + '</p>';
      const tiers = document.createElement('div'); tiers.className = 'tiers';
      for (const b of bands) {
        const name = document.createElement('div'); name.className = 'tier-name'; name.textContent = b.name;
        const row = document.createElement('div'); row.className = 'tier-row ' + b.key;
        for (const it of s.items.filter(i => i.band === b.key)) {
          const c = document.createElement('button'); c.type = 'button';
          c.className = 'chip' + (it.offMap ? ' off' : '') + (it.unsourced ? ' unsourced' : '');
          c.innerHTML = it.name + '<span class="row">#' + it.good + '</span>';
          const key = s.key + ':' + it.name;
          c.dataset.key = key; it._skill = s; it._band = b;
          byKey.set(key, { it, c });
          c.addEventListener('click', () => select(key));
          row.appendChild(c); chips.push({ it, c }); total++; if (it.offMap) off++;
        }
        tiers.appendChild(name); tiers.appendChild(row);
      }
      card.appendChild(tiers); sec.appendChild(card);
    }
    main.appendChild(sec);
  }
  const nt = document.createElement('section'); nt.className = 'group notree';
  nt.innerHTML = '<h2>No tree</h2><p class="note">Goods no skill makes in the game.</p><ul>'
    + data.noTree.map(n => '<li><b>' + n.name + '</b> <span class="count">#' + n.good + '</span>: ' + n.note + '</li>').join('') + '</ul>';
  main.appendChild(nt);
  document.getElementById('count').textContent = total + ' placements, ' + off + ' off-map, ' + data.noTree.length + ' without a tree';

  function up(key, acc) {
    if (acc.has(key)) return acc; acc.add(key);
    const e = byKey.get(key); if (e && e.it.input) up(e.it.input, acc);
    return acc;
  }
  function down(key, acc) {
    if (acc.has(key)) return acc; acc.add(key);
    for (const [k, v] of byKey) if (v.it.input === key) down(k, acc);
    return acc;
  }
  function chainOf(key, acc) { up(key, acc); return down(key, acc); }
  function select(key) {
    const e = byKey.get(key); if (!e) return;
    const it = e.it, s = it._skill, b = it._band;
    const inp = it.input ? byKey.get(it.input) : null;
    const uses = [...byKey.values()].filter(v => v.it.input === key).map(v => v.it._skill.name + ': ' + v.it.name);
    document.getElementById('detail').innerHTML =
      '<b>' + it.name + '</b> <span class="muted">(GOODS.md row ' + it.good + ')</span> · ' + s.name + ', ' + b.name + ' ' + b.range
      + (it.offMap ? ' · <span class="muted">off-map in this period</span>' : '')
      + (it.gate ? ' · <span class="muted">gate:</span> ' + it.gate : '')
      + (it.unsourced ? ' · <span class="muted">unsourced (Rex\'s addition)</span>' : '')
      + '<br>' + it.note
      + (inp ? '<br><span class="muted">needs:</span> ' + inp.it._skill.name + ': ' + inp.it.name : (it.input ? '<br><span class="muted">needs:</span> ' + it.input : ''))
      + (uses.length ? '<br><span class="muted">used by:</span> ' + uses.join('; ') : '');
    const chains = document.getElementById('showChains').checked;
    const lit = chains ? chainOf(key, new Set()) : new Set([key]);
    for (const { c } of chips) { c.classList.toggle('hit', lit.has(c.dataset.key)); c.classList.toggle('dim', chains && !lit.has(c.dataset.key)); }
  }
  document.getElementById('showOff').addEventListener('change', ev => {
    for (const { it, c } of chips) if (it.offMap) c.style.display = ev.target.checked ? '' : 'none';
  });
  document.getElementById('main').addEventListener('click', ev => {
    if (ev.target === main || ev.target.closest('.tier-row') === null && !ev.target.closest('.chip')) {
      for (const { c } of chips) { c.classList.remove('hit', 'dim'); }
    }
  });
})();
</script>
