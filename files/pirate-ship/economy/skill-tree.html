<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goods on the skill trees</title>
<style>
  :root {
    --bg: #f6f3ec; --panel: #fffdf8; --ink: #22201c; --muted: #6b665c; --line: #d9d3c6;
    --gather: #2f6f4e; --craft: #8a4b1f; --off: #9a8f7a; --accent: #b23a2a;
    --novice: #e9e4d6; --apprentice: #d6e6da; --journeyman: #c3d9d2; --expert: #a9c6bf; --master: #e8c9a0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1a17; --panel: #24221e; --ink: #ece7db; --muted: #a39b8c; --line: #3b3831;
      --gather: #7fc7a0; --craft: #e0a06a; --off: #7d7566; --accent: #e8705f;
      --novice: #2d2b26; --apprentice: #263a30; --journeyman: #27433d; --expert: #2b524b; --master: #4d3b22;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1a17; --panel: #24221e; --ink: #ece7db; --muted: #a39b8c; --line: #3b3831;
    --gather: #7fc7a0; --craft: #e0a06a; --off: #7d7566; --accent: #e8705f;
    --novice: #2d2b26; --apprentice: #263a30; --journeyman: #27433d; --expert: #2b524b; --master: #4d3b22;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 Georgia, "Times New Roman", serif; }
  header { padding: 20px 16px 8px; max-width: 1400px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 12px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 8px; }
  .controls label { cursor: pointer; }
  .bands { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; }
  .band-key { display: flex; align-items: baseline; gap: 6px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
  .band-key b { font-size: 13px; }
  .band-key span { color: var(--muted); font-size: 12px; }
  main { max-width: 1400px; margin: 0 auto; padding: 8px 16px 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .group h2 { font-size: 18px; margin: 8px 0 4px; }
  .group.gathering h2 { color: var(--gather); }
  .group.crafting h2 { color: var(--craft); }
  .group p.note { color: var(--muted); margin: 0 0 10px; font-size: 13px; }
  .skill { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
  .skill h3 { margin: 0; font-size: 17px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .skill h3 .tag { font: 11px/1 system-ui, sans-serif; letter-spacing: .04em; text-transform: uppercase; padding: 3px 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
  .skill .covers { color: var(--muted); font-size: 13px; margin: 2px 0 6px; }
  .skill .why { font-size: 13px; margin: 0 0 8px; }
  .tiers { display: grid; grid-template-columns: 96px 1fr; gap: 2px 8px; }
  .tier-name { font: 12px/1.3 system-ui, sans-serif; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding-top: 6px; }
  .tier-row { min-height: 28px; display: flex; flex-wrap: wrap; gap: 4px; padding: 3px 4px; border-radius: 4px; }
  .tier-row.novice { background: var(--novice); } .tier-row.apprentice { background: var(--apprentice); }
  .tier-row.journeyman { background: var(--journeyman); } .tier-row.expert { background: var(--expert); } .tier-row.master { background: var(--master); }
  .chip { font: 13px/1.2 system-ui, sans-serif; padding: 4px 8px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); cursor: pointer; }
  .chip.off { border-style: dashed; color: var(--off); }
  .chip.unsourced { border-style: dotted; border-color: var(--accent); }
  .chip.service { font-style: italic; }
  .chip.hit { outline: 2px solid var(--accent); }
  .chip.dim { opacity: .35; }
  .chip .row { color: var(--muted); font-size: 11px; margin-left: 4px; }
  .detail { position: sticky; bottom: 0; background: var(--panel); border-top: 2px solid var(--line); padding: 10px 16px; max-width: 1400px; margin: 0 auto; font-size: 14px; min-height: 48px; }
  .detail b { font-size: 15px; }
  .detail .muted { color: var(--muted); }
  .notree { grid-column: 1 / -1; }
  .notree ul { margin: 4px 0 0 18px; }
  .count { color: var(--muted); font-size: 13px; }
  .occs { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
  .occ { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .skills-of { margin: 6px 0 4px; display: flex; flex-wrap: wrap; gap: 4px; }
  .skills-of .chip { cursor: default; }
</style>
</head>
<body>
<header>
  <h1>Goods on the skill trees</h1>
  <p class="sub" id="status"></p>
  <div class="controls">
    <label><input type="checkbox" id="showOff" checked> show goods made off-map (dashed)</label>
    <span class="count">dotted red = Rex's addition, no period source · italic = a service, not a good</span>
    <label><input type="checkbox" id="showChains" checked> click a good to light its chain</label>
    <span class="count" id="count"></span>
  </div>
  <div class="bands" id="bands"></div>
</header>
<main id="main"></main>
<div class="detail" id="detail"><span class="muted">Click a good to see why it sits where it does, and what it needs.</span></div>
<script id="data" type="application/json">{"title": "Pirate Ship: goods on the skill trees (proposed)", "status": "Reviewed by Rex 2026-10-29 ('looks good'): the 40 skills, the placements and the occupations stand as the working set. 2026-10-29: spices, drugs, island foods and drinks added from the research (Brewing apart from Distilling, Rex 2026-10-29; imported-only goods listed). Later moves go through this JSON; the record of each split is in GOODS.md 3c and 3d.", "bands": [{"key": "novice", "name": "Novice", "range": "0–24", "period": "no trade grade; a labourer or a 'landsman' at sea (the sea grades date from 1652)"}, {"key": "apprentice", "name": "Apprentice", "range": "25–49", "period": "the guild grade: bound seven years, usually from 14 to 21 (Statute of Artificers; secondary summaries)"}, {"key": "journeyman", "name": "Journeyman", "range": "50–74", "period": "the guild grade: out of his time, free of the company, works for day wages (Campbell 1747)"}, {"key": "expert", "name": "Expert", "range": "75–99", "period": "no guild grade; the nearest is the 'able seaman', at least five years at sea (TNA). 'Head boiler' appears only in 1750s Jamaica, later than the period"}, {"key": "master", "name": "Master", "range": "100", "period": "the guild grade: keeps a shop and apprentices; liveryman above it"}], "flags": {"offMap": "made outside the game's Caribbean in this period (Europe, Asia, Africa, the Spanish mainland); the skill tree says where it would sit if a town ever makes it", "input": "needs a good from another skill (the chain the economy follows)", "gate": "needs another skill at some level to reach the place (Swimming for depth); that skill makes nothing", "unsourced": "Rex's addition with no period source found; a design good, not a historical record", "inputAny": "one of several inputs will do (a ropewalk spins its own yarn from raw fibre, or takes a spinner's)", "inputs": "every listed input is needed (gunpowder takes all three)", "service": "a service, not a traded good: the skill is used on people or ships, and the chip shows what that level can do", "knowledge": "common = every tradesman of the skill knows it here; learned = must be taught or read; foreign = comes only with a far-travelled merchant or a book from another continent (Rex, 2026-10-29). Unset means common", "region": "where a good or recipe belongs: caribbean (the base game) or an expansion region from REGIONS.md. Unset means caribbean. A good from another region reaches the Caribbean only through a rare-items trader, the odd ship, or a merchant's stall (Rex, 2026-10-29)"}, "groups": [{"key": "gathering", "name": "Gathering", "note": "Skills that take goods from land and sea. Raw goods come from here. Swimming is a gate for depth, not a goods skill.", "skills": [{"key": "farming", "name": "Farming", "existing": false, "covers": "planting, harvest, curing and packing crops; the dye plants and flowers as crops", "why": "Crop cultivation only (Rex, 2026-10-28). Livestock, salt, dye-making and perfume have skills of their own.", "items": [{"good": 25, "name": "Pease", "band": "novice", "note": "a field crop any hand could grow and pick"}, {"good": 44, "name": "Grain for meal and flour", "band": "novice", "note": "planting and reaping; milling is Cooking"}, {"good": 8, "name": "Cotton wool", "band": "apprentice", "note": "picking and ginning before bagging (C81)"}, {"good": 6, "name": "Ginger", "band": "apprentice", "note": "the root is scraped so it stays white and does not sprout (L)"}, {"good": 19, "name": "Tobacco, grown", "band": "apprentice", "note": "topping and suckering the plant; the cure is the harder part"}, {"good": 11, "name": "Cacao, grown", "band": "apprentice", "note": "the tree; Jamaica's crops failed to a 'blast' (PT)"}, {"good": 1, "name": "Sugar cane", "band": "journeyman", "note": "planting, cutting and carting to the mill within a day of cutting (L); the boiling is Sugar boiling"}, {"good": 30, "name": "Rice", "band": "journeyman", "note": "wet-field rice took skill the Carolina planters bought from West Africa (SCR)"}, {"good": 19, "name": "Tobacco, cured and packed", "band": "journeyman", "note": "curing, prizing into the hogshead to at least 800 lb (VA30)"}, {"good": 7, "name": "Pimento", "band": "journeyman", "note": "picked green and sun-dried, kept from the dew (EB78)"}, {"good": 10, "name": "Annatto (seed)", "band": "journeyman", "note": "the crop; the paste is Dye Making (D)"}, {"good": 11, "name": "Cacao, sweated and dried", "band": "journeyman", "note": "sweated under plantain leaves, three or four weeks' sun (PT)"}, {"good": 9, "name": "Indigo plant (grown and cut)", "band": "apprentice", "note": "the crop; the vats are Dye Making"}, {"good": 51, "name": "Nopal and cochineal (reared)", "band": "journeyman", "offMap": true, "note": "the insect reared on the cactus in Oaxaca (COC); the dye is Dye Making"}, {"good": 62, "name": "Aromatic flowers and herbs", "band": "apprentice", "note": "Rex's addition: a crop for Perfumery. No period Caribbean source; marked unsourced", "unsourced": true}, {"good": 33, "name": "Flax and hemp", "band": "apprentice", "offMap": true, "note": "European fibre crops for linen and rope; no Caribbean crop in the sources"}, {"good": 48, "name": "Physic garden (simples)", "band": "apprentice", "note": "the herbs an apothecary works from; Culpeper's book was for householders (research). Caribbean physic gardens: open"}, {"good": 76, "name": "Cassava, maize, yams, potatoes", "band": "novice", "note": "Ligon's island breads: 'Tobacco, Ginger, Cotten-wool, Maies, Yeames, and Potatoes'"}, {"good": 77, "name": "Limes, oranges, lemons", "band": "novice", "note": "limes 'much fitter for sauce then the Limon' (L); the juice to London (C81)"}, {"good": 77, "name": "Pineapple, plantain", "band": "apprentice", "note": "'Pines worth all that went before' (L)"}, {"good": 70, "name": "Aloes", "band": "apprentice", "note": "35 lb to London in one month (C81); Blome lists it for Jamaica (1672)"}, {"good": 71, "name": "Drug plants: sarsaparilla, china root, cassia, tamarind (gathered)", "band": "journeyman", "note": "Blome 1672 lists them among Jamaica's commodities"}, {"good": 73, "name": "Vanilla", "band": "journeyman", "offMap": true, "note": "Spanish America; Dampier: 'three pence a cod'"}, {"good": 74, "name": "Coffee (from the 1720s)", "band": "journeyman", "note": "Martinique 1723, Jamaica 1721/1728: the end of the period"}]}, {"key": "husbandry", "name": "Animal Husbandry", "existing": false, "covers": "breeding, feeding and keeping livestock; milk, wool, farm hides", "why": "Split from Farming (Rex, 2026-10-28): keeping animals is its own expertise. Wild cattle and hogs stay with Hunting.", "items": [{"good": 27, "name": "Horses", "band": "journeyman", "note": "bred in New England and shipped at about £12 each (PY)"}, {"good": 22, "name": "Cattle and hogs (farm)", "band": "apprentice", "note": "the meat for Cooking's salt beef and pork"}, {"good": 43, "name": "Milk", "band": "apprentice", "note": "for Cooking's cheese and butter"}, {"good": 33, "name": "Wool", "band": "apprentice", "offMap": true, "note": "English sheep; no Caribbean flock in the sources"}, {"good": 60, "name": "Turtle crawls (kept live)", "band": "apprentice", "note": "penned at Port Royal until sold (D); catching them is Fishing"}]}, {"key": "marine", "name": "Marine Gathering", "existing": false, "covers": "the shore and the shallows: salt pans, shells, pearls, seaweed", "why": "Split from Farming (Rex, 2026-10-28). Pearls sit here with a Swimming gate for the depth, not a skill of their own.", "items": [{"good": 59, "name": "Salt (raked)", "band": "novice", "note": "sun does the work; raking the pans was ordinary labour (D, TC)"}, {"good": 52, "name": "Pearls (dived)", "band": "expert", "gate": "Swimming", "note": "the Rancheria banks; needs Swimming for the depth (E)"}, {"good": 15, "name": "Tortoise shell", "band": "journeyman", "note": "the hawksbill's plates (method open)"}, {"good": 55, "name": "Cowries and shells", "band": "novice", "offMap": true, "note": "Maldives shells, a currency (UWF)"}, {"good": 63, "name": "Seaweed", "band": "novice", "note": "Rex's addition; no period trade in the sources, marked unsourced", "unsourced": true}]}, {"key": "hunting", "name": "Hunting", "existing": false, "covers": "tracking and killing wild cattle, hogs, deer; the carcass", "why": "Obtaining the animal only (Rex, 2026-10-28). Skinning is Butchering, curing is Preserving, leather is Tanning. A hunter with low Butchering wastes the carcass.", "items": [{"good": 16, "name": "Wild cattle and hog carcasses", "band": "novice", "note": "Hispaniola's wild herds (E2)"}, {"good": 32, "name": "Deer carcasses", "band": "apprentice", "note": "Carolina's trade with the Indian nations (CCR)"}, {"good": 57, "name": "Ivory", "band": "journeyman", "offMap": true, "note": "'Elephant's Teeth' from the Guinea coast (J)"}]}, {"key": "fishing", "name": "Fishing", "existing": true, "covers": "the catch; turtling at sea", "why": "Already a skill with its own minigame. Turtling is netting at sea from sloops (D), so it stays here; shells and pearls are Marine Gathering.", "items": [{"good": 60, "name": "Fresh fish", "band": "novice", "note": "the minigame's catch"}, {"good": 60, "name": "Turtle, live", "band": "apprentice", "note": "netted at the Caymans and kept alive in crawls at Port Royal (D, HA)"}]}, {"key": "woodcutting", "name": "Woodcutting", "existing": false, "covers": "felling, riving and squaring timber; the dyewood camps; tar, pitch and turpentine from the pine woods; charcoal burning", "why": "Logwood, lumber and naval stores all came out of the woods. Dampier went to Campeche 'to spend some time at the Logwood Trade' with 'Hatchets, Axes, Macheats, Saws, Wedges' (1705). Tar burner and collier were found as no separate occupation (research-wood-trades.md), so both stay here.", "items": [{"good": 28, "name": "Lumber (felled)", "band": "novice", "note": "felling and hauling; any hand with an axe"}, {"good": 12, "name": "Logwood", "band": "apprentice", "note": "cut and chipped at the Campeche camps, sold at £5 a ton in goods (DV)"}, {"good": 28, "name": "Staves and hoops (rived)", "band": "apprentice", "note": "riving stave bolts for the cooper; Connecticut's cargo to Barbados (CT)"}, {"good": 29, "name": "Shingles", "band": "apprentice", "note": "rived and shaved; late evidence only (CTH)"}, {"good": 13, "name": "Other dyewoods, lignum vitae", "band": "apprentice", "note": "as logwood; fustic and brazeletto in the 1681 return (C81)"}, {"good": 31, "name": "Tar, pitch, turpentine", "band": "journeyman", "note": "the kiln burn takes judgement; 40,000 barrels a year by 1720 (SCN)"}, {"good": 14, "name": "Mahogany", "band": "journeyman", "note": "choosing, felling and squaring the great logs; 'bulky and relatively light' (MH)"}, {"good": 39, "name": "Charcoal", "band": "apprentice", "input": "woodcutting:Lumber (felled)", "note": "the collier's clamp; Rex keeps charcoal burning inside Woodcutting (2026-10-28)"}]}, {"key": "mining", "name": "Mining", "existing": false, "covers": "ore, the furnace and the forge that makes bar metal; silver refining", "why": "Smelting sits here with the mine, not with the smith: the smith buys bar iron. Nearly all of it is off-map in this period (Spanish silver, Swedish and Bilbao iron).", "items": [{"good": 39, "name": "Nitre earth", "band": "novice", "note": "nitrate-bearing earth from dovecotes, stables and caves; the saltpetre-men's raw stuff. Caribbean source open"}, {"good": 39, "name": "Sulphur (brimstone)", "band": "apprentice", "offMap": true, "note": "dug from volcanic deposits; Sicily supplied Europe. Nothing in the Caribbean sources (open)"}, {"good": 36, "name": "Ore and lead", "band": "apprentice", "offMap": true, "note": "lead for shot; no Caribbean mine in the sources"}, {"good": 36, "name": "Bar iron", "band": "journeyman", "offMap": true, "note": "£16 10s–£18 a ton in London (TR); 'voyage iron' to Africa (JS)"}, {"good": 36, "name": "Steel, brass, pewter (alloys)", "band": "expert", "offMap": true, "note": "blister steel from Sheffield; brass from calamine; pewter from tin and lead. No colonial steel before the 1720s (research), so all off-map"}, {"good": 49, "name": "Silver", "band": "expert", "offMap": true, "note": "Potosí to Portobelo; refining with mercury (WHF)"}, {"good": 50, "name": "Gold and gold dust", "band": "journeyman", "offMap": true, "note": "Brazil and the Guinea coast; washing dust takes less than refining silver"}]}]}, {"key": "crafting", "name": "Crafting", "note": "Skills that turn raw goods into made ones. Each item names the good it needs.", "skills": [{"key": "cooking", "name": "Cooking", "existing": true, "covers": "meals and dishes; the galley; chocolate", "why": "Meals only (Rex, 2026-10-28). Milling, Baking, Butchering, Preserving, Dairying and Waxworking are skills of their own.", "items": [{"good": 18, "name": "Lime juice", "band": "novice", "note": "pressed and casked; 1,512 gallons to London in one month (C81)"}, {"good": 21, "name": "Salmagundi and the hot meal", "band": "apprentice", "input": "preserving:Salt beef and pork", "note": "the one hot meal from the galley (DUTIES); not a traded good"}, {"good": 11, "name": "Chocolate", "band": "journeyman", "input": "farming:Cacao, sweated and dried", "note": "roasting and grinding the nut; a Spanish taste first"}, {"good": 80, "name": "Punch", "band": "apprentice", "inputs": ["distilling:Rum", "farming:Limes, oranges, lemons", "sugar-boiling:Muscovado sugar"], "note": "rum, water, lime, sugar, 'a little Nutmeg scrap'd on the top' (Sloane); Avery 'mightily addicted to Punch' (J)"}, {"good": 80, "name": "Flip", "band": "apprentice", "inputs": ["brewing:Small beer", "distilling:Rum"], "note": "'a sort of Sailors Drink, made of Ale, Brandy and Sugar' (Bailey 1724), heated with a loggerhead"}, {"good": 69, "name": "Preserves and sugar candy", "band": "journeyman", "inputs": ["sugar-boiling:Clayed (white) sugar", "farming:Ginger"], "note": "preserves need white sugar (L); preserved ginger 0.64 and white candy 0.50 guilders a lb at Amsterdam (1691)"}, {"good": 74, "name": "Coffee, tea and chocolate (brewed)", "band": "novice", "inputsAny": ["farming:Coffee (from the 1720s)", "cooking:Chocolate"], "note": "Roberts 'drank his Tea constantly' (J); the tea itself is imported (below)"}]}, {"key": "milling", "name": "Milling", "existing": false, "covers": "grinding grain to flour and meal; the sugar mill is Sugar boiling", "why": "Its own skill (Rex, 2026-10-28). New York guarded its flour's name with a bolting monopoly (VR).", "items": [{"good": 44, "name": "Meal (coarse)", "band": "novice", "input": "farming:Grain for meal and flour", "note": "'Barrels of meale close put up' (L)"}, {"good": 26, "name": "Oatmeal", "band": "apprentice", "input": "farming:Grain for meal and flour", "note": "Roberts took '10 Casks of Oatmeal' (J)"}, {"good": 20, "name": "Flour (bolted)", "band": "journeyman", "input": "farming:Grain for meal and flour", "note": "bolted fine; 196 lb to the barrel (FL)"}]}, {"key": "baking", "name": "Baking", "existing": false, "covers": "bread and ship's biscuit", "why": "Its own skill (Rex, 2026-10-28). Large quantities of biscuit were baked in the Connecticut Valley and Philadelphia for the islands (PH).", "items": [{"good": 76, "name": "Cassava and potato bread", "band": "novice", "input": "farming:Cassava, maize, yams, potatoes", "note": "'The third sort of bread we use, is only Potatoes' (L)"}, {"good": 21, "name": "Bread", "band": "novice", "input": "milling:Meal (coarse)", "note": "daily bread; not a cargo"}, {"good": 21, "name": "Ship's biscuit", "band": "apprentice", "input": "milling:Flour (bolted)", "note": "baked hard, twice; 16s a hundredweight (PY); well baked, it keeps for years (SV)"}]}, {"key": "butchering", "name": "Butchering", "existing": false, "covers": "skinning and dividing a carcass: meat, raw hide, fat, bone", "why": "Its own skill (Rex, 2026-10-28): obtaining the animal is Hunting or Animal Husbandry; the carcass is this. Raw hides come from here.", "items": [{"good": 22, "name": "Fresh meat", "band": "novice", "input": "husbandry:Cattle and hogs (farm)", "note": "for the galley and for Preserving"}, {"good": 16, "name": "Raw hides", "band": "apprentice", "input": "hunting:Wild cattle and hog carcasses", "note": "flaying clean; 'cow hides 69 ... buff hides 768' to London (C81)"}, {"good": 17, "name": "Tallow (rendered)", "band": "apprentice", "input": "hunting:Wild cattle and hog carcasses", "note": "the fat rendered; sold with the hides (E2)"}, {"good": 32, "name": "Deerskins (raw)", "band": "journeyman", "input": "hunting:Deer carcasses", "note": "a clean skin is worth more; 'Skinns' from Carolina (CCR)"}]}, {"key": "preserving", "name": "Preserving", "existing": false, "covers": "salting, smoking, drying: meat and fish that keep at sea", "why": "Its own skill (Rex, 2026-10-28). The boucaniers' smoking frame and the salt-fish flakes are the same expertise: keeping food.", "items": [{"good": 24, "name": "Salt fish", "band": "novice", "input": "fishing:Fresh fish", "note": "split, salted and dried; the poor grade went to the islands (HV)"}, {"good": 61, "name": "Boucan (smoked meat)", "band": "apprentice", "input": "butchering:Fresh meat", "note": "hardened with smoke for sea voyages (E2)"}, {"good": 22, "name": "Salt beef and pork", "band": "journeyman", "input": "butchering:Fresh meat", "note": "cut, brined and packed tight in barrel; a short barrel was noticed (PY)"}, {"good": 61, "name": "Salted boar", "band": "journeyman", "input": "butchering:Fresh meat", "note": "'salt it, and sell it so to the planters' (E2)"}]}, {"key": "dairying", "name": "Dairying", "existing": false, "covers": "butter and cheese from milk", "why": "Its own skill (Rex, 2026-10-28). Nearly all of it was off-map: Ligon says butter and cheese from England or Holland often spoil on the way (L).", "items": [{"good": 43, "name": "Butter", "band": "apprentice", "input": "husbandry:Milk", "note": "in firkins; weight open (ML)"}, {"good": 43, "name": "Cheese", "band": "journeyman", "input": "husbandry:Milk", "note": "'a hundred-weight of Gloucester cheese' to Virginia (BR)"}]}, {"key": "waxworking", "name": "Waxworking", "existing": false, "covers": "candles first, then wax seals, moulded and ceremonial candles, wax portraits and figures", "why": "Rex's skill (2026-10-28), renamed from Candlemaking so it has a ladder to Master. Tallow candles are sourced (L); beeswax and wax sculpture were real European trades but nothing in the period Caribbean sources, so those tiers are marked unsourced. Wax sculpture was an artist's trade, not the top of the chandler's; joining them is a design choice.", "items": [{"good": 45, "name": "Tallow candles", "band": "novice", "input": "butchering:Tallow (rendered)", "note": "dipped; they fuse in the heat (L)"}, {"good": 45, "name": "Wax seals", "band": "novice", "unsourced": true, "note": "sealing wax for letters; no Caribbean source"}, {"good": 45, "name": "Beeswax candles", "band": "apprentice", "unsourced": true, "note": "cleaner burning, for church and the cabin; beeswax supply in the Caribbean open"}, {"good": 45, "name": "Moulded and altar candles", "band": "journeyman", "unsourced": true, "note": "consistent sizes, ceremonial forms"}, {"good": 45, "name": "Wax portraits and anatomical models", "band": "expert", "unsourced": true, "note": "a European art of the period; unsourced here"}, {"good": 45, "name": "Lifelike wax figures", "band": "master", "unsourced": true, "note": "the INFP's signature work (story: brothel, wax figures); a design good"}]}, {"key": "tanning", "name": "Tanning", "existing": false, "covers": "raw hide to leather", "why": "Kept apart from Butchering (Rex, 2026-10-28): a butcher skins, a tanner makes leather. Leatherworking makes the goods.", "items": [{"good" ean perfume trade in the period sources; the goods are marked unsourced.", "items": [{"good": 62, "name": "Fragrant oils and waters", "band": "journeyman", "input": "farming:Aromatic flowers and herbs", "note": "unsourced for the Caribbean; a cultural good if one region prizes it", "unsourced": true}, {"good": 62, "name": "Perfume", "band": "expert", "input": "perfumery:Fragrant oils and waters", "note": "unsourced; the finished luxury", "unsourced": true}]}, {"key": "smithing", "name": "Blacksmithing (Smithing)", "existing": true, "covers": "the forge: nails, hoops, chains, tools, horseshoes, locks, anchors; forged gun barrels", "why": "The existing STATS.md Smithing, now the blacksmith's trade alone (Rex, 2026-10-28). Campbell 1747 calls it 'the most comprehensive Branch of all the Mechanic' trades and lists the anchor-smith as its own laborious branch; the locksmith is 'see Smith'; the farrier 'a compound of the smith and' the horse-doctor. Nailer, locksmith, farrier and anchorsmith are folded in here on that evidence (research-metal-trades.md).", "items": [{"good": 37, "name": "Nails", "band": "novice", "input": "mining:Bar iron", "note": "6d a pound retail (TR); the Midlands nail trade was a by-employment, not a company"}, {"good": 37, "name": "Iron hoops", "band": "apprentice", "input": "mining:Bar iron", "note": "for the cooper"}, {"good": 37, "name": "Tools: hoes, axes, knives (rough)", "band": "apprentice", "input": "mining:Bar iron", "note": "'nails, hoes, and axes' to Virginia (BR)"}, {"good": 27, "name": "Horseshoes (farriery)", "band": "apprentice", "input": "mining:Bar iron", "note": "Farriers' Company 1674; 'makes Shoes for Horses, and puts them on' (Campbell)"}, {"good": 37, "name": "Chains, hinges, ship's ironwork", "band": "journeyman", "input": "mining:Bar iron", "note": "the ship's fittings the carpenter needs"}, {"good": 38, "name": "Gun barrels (forged)", "band": "journeyman", "input": "mining:Bar iron", "note": "the gunsmith bought barrels in and made the lock (Campbell)"}, {"good": 37, "name": "Locks and keys", "band": "expert", "input": "mining:Steel, brass, pewter (alloys)", "note": "'see Smith' (Campbell's index); needs ingenuity 'almost as any Branch of the Trade'"}, {"good": 37, "name": "Anchors", "band": "expert", "input": "mining:Bar iron", "note": "the anchor-smith, 'laborious and profitable Branch of the Smith Trade' (Campbell)"}]}, {"key": "gunsmithing", "name": "Gunsmithing", "existing": false, "covers": "the lock, the stock and the mounting; repairs of small arms", "why": "Its own trade (Rex, 2026-10-28): Gunmakers' Company chartered 1637 with powers of 'search view gage proof trial'; proof house from 1657. Campbell: the gunsmith made the lock and bought barrels. Port Royal had gun and sword smiths (Museum of Miami). The ship's armourer (repairs) is folded in: by 1747 the armourer's own trade was 'merely nominal'.", "items": [{"good": 38, "name": "Small-arms repair (the armourer)", "band": "novice", "note": "the ship's armourer; 'Mariner and Armourer' in a will (research-occupations.md)"}, {"good": 38, "name": "Pistols", "band": "journeyman", "inputs": ["smithing:Gun barrels (forged)", "carpentry:Planks and boards (sawn)"], "note": "lock, stock and barrel; the stock is the carpenter's wood"}, {"good": 38, "name": "Muskets", "band": "journeyman", "offMap": true, "inputs": ["smithing:Gun barrels (forged)", "carpentry:Planks and boards (sawn)"], "note": "'a great number of muskets' taken (E); proofed in London"}, {"good": 38, "name": "Fine locks and fowling pieces", "band": "expert", "offMap": true, "input": "mining:Steel, brass, pewter (alloys)", "note": "the gunmaker's best work; a design tier (open)"}]}, {"key": "bladesmithing", "name": "Bladesmithing (cutler)", "existing": false, "covers": "knives, razors, scissors; cutlasses and swords; hilts and scabbards", "why": "Its own trade (Rex, 2026-10-28): Cutlers' Company chartered 1416; Campbell separates the cutler (knives, razors, scissors, lancets) from the sword-cutler who mounts hilts. Blades 'come mostly from abroad' (Campbell): Hounslow (1630s–70s) and Shotley Bridge (1691) were German-staffed works, so sword blades sit off-map.", "items": [{"good": 37, "name": "Knives and razors", "band": "apprentice", "input": "mining:Steel, brass, pewter (alloys)", "note": "the cutler's staple; surgeon's lancets too"}, {"good": 38, "name": "Cutlasses", "band": "journeyman", "offMap": true, "input": "mining:Steel, brass, pewter (alloys)", "note": "the boarder's weapon; blades from abroad, mounted here"}, {"good": 38, "name": "Swords, mounted (sword-cutler)", "band": "expert", "offMap": true, "inputs": ["mining:Steel, brass, pewter (alloys)", "leatherworking:Belts, baldrics, scabbards"], "note": "hilt, grip and scabbard; 'Swords, knives' shipped to Barbados (L)"}, {"good": 38, "name": "Fine blades (Hounslow, Solingen)", "band": "master", "offMap": true, "input": "mining:Steel, brass, pewter (alloys)", "note": "the German smiths' work; nothing like it in the colonies (research)"}]}, {"key": "founding", "name": "Founding", "existing": false, "covers": "casting metal: shot, pewter ware, brass fittings, bells, great guns", "why": "Its own trade (Rex, 2026-10-28): Founders' Company 1614; the King's Gunfounder post from 1615 (the Brownes, Weald furnaces); Woolwich brass foundry 1716–18. Pewterers (company by 1348) are folded in: pewter is cast in a mould (Campbell). 33 pewter pieces with London touch-marks of c. 1689–1712 came off the QAR wreck. No cannon was founded in an English colony before 1730 (research), so the guns sit off-map.", "items": [{"good": 39, "name": "Shot (cast lead)", "band": "novice", "input": "mining:Ore and lead", "note": "1,281 lead shot in one QAR lab batch (QAR); any hand with a mould"}, {"good": 64, "name": "Pewter plates and mugs", "band": "apprentice", "offMap": true, "input": "mining:Steel, brass, pewter (alloys)", "note": "33 pieces on the QAR, London marks c. 1689–1712 (QAR); Port Royal had pewterers"}, {"good": 37, "name": "Brass fittings, buckles, candlesticks", "band": "journeyman", "offMap": true, "input": "mining:Steel, brass, pewter (alloys)", "note": "Campbell: the founder casts all that is brass in a brazier's shop"}, {"good": 38, "name": "Bells and swivel guns", "band": "expert", "offMap": true, "input": "mining:Steel, brass, pewter (alloys)", "note": "small guns; 'four Swivels' taken by Low (J)"}, {"good": 38, "name": "Great guns (cannon)", "band": "master", "offMap": true, "input": "mining:Bar iron", "note": "the gunfounder's furnace and boring mill; 29 located on the QAR wreck (QAR)"}]}, {"key": "goldsmithing", "name": "Precious Metalworking (goldsmith)", "existing": false, "covers": "plate, buttons and buckles, jewellery; assaying", "why": "Its own trade (Rex, 2026-10-28): Goldsmiths' Company (Campbell dates it 1180) and 'employs several distinct' workmen, almost one per article. 'Goldsmith of Jamaica' in a 1693 will; silversmiths and goldsmiths at Port Royal (Museum of Miami). Plate was valued at 'ten pieces of eight to a pound' (E).", "items": [{"good": 49, "name": "Silver buttons and buckles", "band": "apprentice", "input": "mining:Silver", "note": "small work"}, {"good": 49, "name": "Plate (cups, dishes)", "band": "journeyman", "input": "mining:Silver", "note": "uncoined plate shared out by weight (E)"}, {"good": 50, "name": "Jewellery and chains", "band": "expert", "input": "mining:Gold and gold dust", "note": "'chains and trinkets' in Roberts' Brazil prize (J)"}, {"good": 49, "name": "Assay and fine work", "band": "master", "note": "judging and refining the metal; the diamond cross for the King of Portugal (J) as the kind of piece"}]}, {"key": "carpentry", "name": "Carpentry (joinery)", "existing": true, "covers": "sawing, framing, house carpentry, joinery, gun carriages; the ship's repairs (DUTIES)", "why": "The existing STATS.md Carpentry. Joinery is folded in: Campbell 1747 says the joiner is 'generally the same Person with the Carpenter', and the London demarcation dispute (1630–80) was between two companies doing one trade. The sawyer appears only in Campbell's premium table; Ligon's Barbados had 'three whip-Sawes, going all at once in a Frame or Pit', so sawing is the Novice rung.", "items": [{"good": 28, "name": "Planks and boards (sawn)", "band": "novice", "input": "woodcutting:Lumber (felled)", "note": "the saw pit (L)"}, {"good": 28, "name": "Framing and house carpentry", "band": "apprentice", "input": "carpentry:Planks and boards (sawn)", "note": "Ligon wanted 'Carpenters, Joyners, Masons' as servants (L)"}, {"good": 28, "name": "Ship's repairs: patching, shoring", "band": "apprentice", "input": "carpentry:Planks and boards (sawn)", "note": "the ship's carpenter; pirates 'forced away the Carpenter from the Pink' (J)"}, {"good": 28, "name": "Joinery: doors, windows, chests", "band": "journeyman", "input": "carpentry:Planks and boards (sawn)", "note": "the 1631 aldermen's ruling listed joiners' work (research)"}, {"good": 38, "name": "Gun carriages", "band": "journeyman", "inputs": ["carpentry:Planks and boards (sawn)", "smithing:Chains, hinges, ship's ironwork"], "note": "wood and iron; a great gun is useless without one"}]}, {"key": "shipwrighting", "name": "Shipwrighting", "existing": false, "covers": "boats, sloops and ships; caulking and careening; masts, yards and blocks", "why": "Its own trade (Rex, 2026-10-28): Shipwrights' Company charters 1605 and 1612; Campbell has 'ship-builder and ship-carpenter', block-maker and boat-builder as entries. Bermuda built cedar sloops from the mid-1600s. Caulker and mast-maker were found as no separate entries, so both are folded in. The ship itself was the most valuable prize of all (Part 2).", "items": [{"good": 65, "name": "Caulking (oakum and pitch)", "band": "novice", "inputs": ["woodcutting:Tar, pitch, turpentine"], "note": "also needs old rope picked to oakum (DUTIES); the caulker's rung"}, {"good": 65, "name": "Ship's boat (yawl, longboat)", "band": "apprentice", "input": "carpentry:Planks and boards (sawn)", "note": "Campbell's boat and lighter builders"}, {"good": 65, "name": "Masts, yards and blocks", "band": "journeyman", "inputs": ["woodcutting:Lumber (felled)", "carpentry:Planks and boards (sawn)"], "note": "Low took 'a mast, yard and hawsers' (J); Campbell's block-maker"}, {"good": 65, "name": "Careening and refit", "band": "journeyman", "input": "shipwrighting:Caulking (oakum and pitch)", "note": "the ship hauled down on a beach and the bottom scraped (DUTIES)"}, {"good": 65, "name": "Sloop (Bermuda cedar)", "band": "expert", "inputs": ["carpentry:Planks and boards (sawn)", "smithing:Chains, hinges, ship's ironwork", "shipwrighting:Masts, yards and blocks"], "note": "Bermuda cedar sloops from the mid-1600s (research); Bonnet's and Teach's sloops"}, {"good": 65, "name": "Ship (brigantine, frigate)", "band": "master", "offMap": true, "inputs": ["shipwrighting:Sloop (Bermuda cedar)", "shipwrighting:Masts, yards and blocks"], "note": "Boston and the Thames yards; no Caribbean ship of size in the sources (open)"}]}, {"key": "cabinetmaking", "name": "Cabinetmaking (carving)", "existing": false, "covers": "fine furniture, carving, veneer; mahogany work", "why": "Its own trade (Rex, 2026-10-28): Campbell 1747 gives the cabinet-maker and the carver their own entries apart from the joiner; Port Royal's 1688 list names 'Turners, Cabanittmakers' (second-hand). The mahogany furniture trade grew after the 1721 Act (MH).", "items": [{"good": 14, "name": "Plain furniture (tables, stools)", "band": "apprentice", "input": "carpentry:Planks and boards (sawn)", "note": "the joiner's edge of the trade"}, {"good": 14, "name": "Mahogany furniture", "band": "journeyman", "input": "woodcutting:Mahogany", "note": "the 1720s trade (MH)"}, {"good": 14, "name": "Carving and ornament", "band": "expert", "input": "woodcutting:Mahogany", "note": "Campbell's carver; a ship's stern-work too"}, {"good": 14, "name": "Veneered and inlaid pieces", "band": "master", "offMap": true, "input": "woodcutting:Mahogany", "note": "the London cabinet-maker's best work; a design tier (open)"}]}, {"key": "millwrighting", "name": "Millwrighting (wheelwright)", "existing": false, "covers": "mills and wheels: cart wheels, the cattle mill, the windmill", "why": "Its own trade (Rex, 2026-10-28): Campbell 1747 has mill-wright and wheeler as separate entries, and Ligon asked Barbados for 'Mill-wrights, Wheel-wrights'. The sugar mill is the heart of a sugar island, so this is the trade a planter cannot do without.", "items": [{"good": 27, "name": "Cart wheels and carts", "band": "apprentice", "inputs": ["carpentry:Planks and boards (sawn)", "smithing:Iron hoops"], "note": "Ligon: 'the Christian that has the charge of the carriages'"}, {"good": 1, "name": "Cattle mill (sugar)", "band": "journeyman", "inputs": ["carpentry:Planks and boards (sawn)", "smithing:Chains, hinges, ship's ironwork"], "note": "three rollers driven by oxen or horses (L); Sugar boiling needs it"}, {"good": 1, "name": "Windmill or water mill", "band": "expert", "inputs": ["carpentry:Framing and house carpentry", "smithing:Chains, hinges, ship's ironwork"], "note": "Barbados's windmills; a design tier for the engine (open)"}]}, {"key": "cooperage", "name": "Cooperage", "existing": true, "covers": "casks: slack (dry) work for flour and sugar, tight (wet) work for rum and molasses; turned ware", "why": "Already a skill. Coopers' Company charters 1501 and 1661; Parliament gave it control of the craft in 1532. The slack (dry) and tight (wet) branches are reported but the research could not open a page confirming them for the period (unverified). The turner is folded in: Campbell says 'the common Turner is generally a Cooper'. About half the goods travel in its casks (3b).", "items": [{"good": 28, "name": "Staves and heads, dressed", "band": "apprentice", "input": "woodcutting:Staves and hoops (rived)", "note": "jointing and hollowing the staves"}, {"good": 28, "name": "Turned ware (bowls, sheaves, handles)", "band": "apprentice", "input": "carpentry:Planks and boards (sawn)", "note": "the turner's lathe; Campbell folds him into the cooper"}, {"good": 20, "name": "Slack casks (barrel, hogshead for dry goods)", "band": "journeyman", "input": "cooperage:Staves and heads, dressed", "note": "flour barrels, sugar hogsheads; 196 lb of flour to the barrel (FL)"}, {"good": 5, "name": "Tight casks (rum, molasses, wine)", "band": "expert", "input": "cooperage:Staves and heads, dressed", "note": "must hold liquid; a leaking cask loses the rum (DUTIES)"}]}, {"key": "spinning", "name": "Spinning", "existing": false, "covers": "fibre into yarn and thread: cotton, wool, flax, silk", "why": "Split from Weaving (Rex, 2026-10-28): the spinner and the weaver were different trades. Finer and harder fibres need higher skill; the fibre itself must exist (a master cannot spin silk without silk).", "items": [{"good": 8, "name": "Cotton yarn", "band": "apprentice", "input": "farming:Cotton wool", "note": "the island's own fibre (C81)"}, {"good": 33, "name": "Wool yarn", "band": "apprentice", "offMap": true, "input": "husbandry:Wool", "note": "English wool"}, {"good": 33, "name": "Linen thread", "band": "journeyman", "offMap": true, "input": "farming:Flax and hemp", "note": "for dowlas, holland and sailcloth"}, {"good": 34, "name": "Silk thread", "band": "expert", "offMap": true, "note": "Asian silk; the hardest fibre to handle"}]}, {"key": "weaving", "name": "Weaving", "existing": false, "covers": "yarn into cloth on the loom: cotton, linen, woollen, canvas, silk", "why": "Cloth only (Rex, 2026-10-28). Nearly all of it was off-map: the colonies imported their cloth (L, BR); Massachusetts made nothing above 4s a yard (CSP).", "items": [{"good": 33, "name": "Cotton cloth (coarse)", "band": "apprentice", "input": "spinning:Cotton yarn", "note": "under 4s a yard, the colonial ceiling (CSP)"}, {"good": 33, "name": "Coarse linen (dowlas, osnaburg)", "band": "apprentice", "offMap": true, "input": "spinning:Linen thread", "note": "1s 5d–1s 8d an ell (TR); servants' and slaves' cloth"}, {"good": 33, "name": "Woollens (broadcloth, duffels)", "band": "journeyman", "offMap": true, "input": "spinning:Wool yarn", "note": "10s–23s 6d a yard (TR); duffels for the Indian trade (CSP)"}, {"good": 46, "name": "Sailcloth and canvas", "band": "journeyman", "offMap": true, "input": "spinning:Linen thread", "note": "the sailmaker sews it; the weaver makes it"}, {"good": 33, "name": "Fine linen (holland)", "band": "expert", "offMap": true, "input": "spinning:Linen thread", "note": "2s 4d–2s 8d a yard (TR)"}, {"good": 34, "name": "Silk, chintz, muslin", "band": "master", "offMap": true, "input": "spinning:Silk thread", "note": "Asian looms; chintzes in a French prize (J)"}]}, {"key": "ropemaking", "name": "Ropemaking", "existing": false, "covers": "the ropewalk: twine, cordage, cables", "why": "Its own trade (Rex, 2026-10-28). It spins its own yarn from raw hemp or takes a spinner's, so either input will do. Cables and coils of rope were among the first things pirates took (J).", "items": [{"good": 46, "name": "Twine and small stuff", "band": "novice", "inputAny": ["farming:Flax and hemp", "spinning:Cotton yarn"], "note": "marline, spun yarn; the sailmaker's twine"}, {"good": 46, "name": "Cordage (running rigging)", "band": "apprentice", "offMap": true, "inputAny": ["farming:Flax and hemp", "spinning:Linen thread"], "note": "'several Coils of Rope' taken from the King Solomon (J)"}, {"good": 46, "name": "Cables and hawsers", "band": "journeyman", "offMap": true, "inputAny": ["farming:Flax and hemp", "spinning:Linen thread"], "note": "'two Cables' (J); the anchor cable is the ropewalk's largest work"}]}, {"key": "tailoring", "name": "Tailoring", "existing": false, "covers": "cloth into fitted clothes; sewing, embroidery, knitting and repair as activities inside it", "why": "Split from Weaving (Rex, 2026-10-28): the tailor does not make cloth. Sailmaking stays its own ship skill (STATS.md).", "items": [{"good": 35, "name": "Shirts and trousers (coarse)", "band": "apprentice", "input": "weaving:Coarse linen (dowlas, osnaburg)", "note": "a servant's shirt at 2s 6d (CSP)"}, {"good": 35, "name": "Coats and fitted clothes", "band": "journeyman", "input": "weaving:Woollens (broadcloth, duffels)", "note": "a cloth coat at 15s 6d (CSP)"}, {"good": 35, "name": "Fine dress, embroidery", "band": "expert", "input": "weaving:Fine linen (holland)", "note": "'a suit of clothes, a wig' taken at the King Solomon (J)"}, {"good": 34, "name": "Silk dress", "band": "master", "offMap": true, "input": "weaving:Silk, chintz, muslin", "note": "silk and linen shared out at Maracaibo (E)"}]}, {"key": "medicine", "name": "Surgery (Surgery and medicine)", "existing": true, "covers": "wounds, bleeding and purging, bones, amputation; the ship's surgeon and his mate", "why": "The existing STATS.md skill, now the surgeon's craft alone (Rex, 2026-10-28). Campbell 1747 lists Physician, Surgeon, Chymist, Druggist and Apothecary as five separate 'Professors'. The surgeon was bound seven years and examined by the Barber-Surgeons' Company (one company until 1745); the surgeon's mate was a rank under him, examined too. Exquemelin served the buccaneers 'in the capacity of barber-surgeon'; Roberts' fleet elected a chief surgeon (J). Every item here is a service, not a good.", "items": [{"good": 48, "name": "Dressing wounds (the surgeon's mate)", "band": "novice", "service": true, "note": "recruited at about 16 with basic training (research)"}, {"good": 48, "name": "Bleeding, purging, the clyster", "band": "apprentice", "service": true, "input": "bladesmithing:Knives and razors", "note": "lancets from the cutler; clyster pumps on the QAR wreck (QAR)"}, {"good": 48, "name": "Setting bones, drawing teeth", "band": "journeyman", "service": true, "note": "barber-surgeons drew teeth; the 'pretending bone-setters' were the empirics (Turner 1694)"}, {"good": 48, "name": "Amputation and the great operations", "band": "expert", "service": true, "input": "bladesmithing:Knives and razors", "note": "Exquemelin's compensation table: a lost limb paid in pieces of eight or slaves (E)"}, {"good": 48, "name": "Chief surgeon (examined, elected)", "band": "master", "service": true, "note": "examined at Surgeons' Hall for the navy (Campbell); elected chief surgeon in Roberts' fleet (J)"}]}, {"key": "apothecary", "name": "Apothecary", "existing": false, "covers": "simples, salves, compound medicines; laudanum, mercury and bark; stocking the surgeon's chest", "why": "Its own trade (Rex, 2026-10-28): the Society of Apothecaries was chartered 6 December 1617, apart from the Grocers; a seven-year apprenticeship; after the Rose case (1703/04) apothecaries could prescribe. Ligon: 'the Apothecary of the Plantation, which we call Doctor'. Campbell: 'The Chymists are generally Apothecaries', so the chymist's preparations sit here, drawing on Chemical Refining. The INTJ's calling.", "items": [{"good": 48, "name": "Simples and herb remedies", "band": "novice", "input": "farming:Physic garden (simples)", "note": "Culpeper's householder medicine; the plantation doctor's dram of kill-devil (L)"}, {"good": 48, "name": "Salves, plasters, lime-juice regimen", "band": "apprentice", "inputs": ["farming:Physic garden (simples)", "cooking:Lime juice"], "note": "lime juice against scurvy (DUTIES); whether it stood in the Pharmacopoeia: open"}, {"good": 48, "name": "Compound medicines (the Pharmacopoeia)", "band": "journeyman", "inputs": ["farming:Physic garden (simples)", "distilling:Aqua vitae (kill-devil)"], "note": "Pharmacopoeia Londinensis 1618 and after; spirits for tinctures"}, {"good": 72, "name": "Peruvian bark against fevers", "band": "expert", "offMap": true, "knowledge": "learned", "input": "imported:Peruvian bark (cinchona)", "note": "sold by London chemists from 1658; Talbor's cure 1672–78. The bark is Spanish and the use was a secret: learned knowledge (3f)"}, {"good": 48, "name": "Chemical medicines: mercury, antimony, laudanum", "band": "expert", "offMap": true, "input": "refining:Reagents and salts", "note": "the QAR syringe held mercury for the pox (QAR); opium preparations in the Pharmacopoeia (research)"}, {"good": 48, "name": "The surgeon's chest, stocked", "band": "master", "input": "apothecary:Compound medicines (the Pharmacopoeia)", "note": "£300–400 at Charleston (J); 200–250 pieces of eight as the buccaneers' fixed share (E)"}]}, {"key": "physic", "name": "Physic (the physician)", "existing": false, "covers": "diagnosis, fevers, regimen, prescribing; the learned branch", "why": "Its own trade (Rex, 2026-10-28): the College of Physicians (1518) licensed practice and its Fellows held university degrees; 'Doctor in Physic' is a status word in a Port Royal will (1725). Campbell keeps the physician apart from the surgeon and the apothecary. Rare in the colonies: most 'doctors' were apothecaries or surgeons, so the top tiers sit off-map. Services, not goods.", "items": [{"good": 48, "name": "Regimen and diet", "band": "apprentice", "service": true, "note": "the plantation doctor's level"}, {"good": 48, "name": "Diagnosing fevers and the flux", "band": "journeyman", "service": true, "note": "scurvy and fever killed more than battle (DUTIES)"}, {"good": 48, "name": "Prescribing (the apothecary makes it up)", "band": "expert", "service": true, "input": "apothecary:Compound medicines (the Pharmacopoeia)", "note": "the physician prescribes, the apothecary compounds; the Rose case blurred it (research)"}, {"good": 48, "name": "Doctor in Physic (university)", "band": "master", "service": true, "offMap": true, "note": "'Doctor in Physic' at Port Royal, 1725; Campbell sneers at bought Latin diplomas"}]}]}], "noTree": [{"good": 53, "name": "Enslaved people", "note": "Open for Rex, item 1"}, {"good": 54, "name": "Voyage iron", "note": "the same bar iron as Mining: Bar iron, sold as currency on the African coast"}, {"good": 58, "name": "Africa trade cargo", "note": "a mix of the goods above, not a good"}], "bandsSource": "research-trade-grades.md (shared notes folder): guild ladder, sea ranks, Ligon's overseers and tradesmen; 'novice' and 'expert' found as no grade", "rule": "Every recipe needs materials + equipment + a minimum skill band (Rex, 2026-10-28). Skill never creates a material: a master spinner cannot spin silk without silk. No skill or recipe is ever manifested by levelling: each is learned a real way (a book, a blueprint, a recipe, a teacher). Skill level sets speed, quality and success, and some items need a level besides (Rex, 2026-10-29).", "occupations": {"note": "An occupation is a label, not a skill: it groups the skills a person of that calling practised, levels nothing, grants nothing, and a character may carry more than one (Rex, 2026-10-28). The words are the ones period wills and indentures use; the record styles a person by ONE word, and a second appears for a small minority (under 5% of mariners), nearly always sea + shipboard craft: 'Mariner and Cooper', 'Mariner and Surgeon'. 'Alchemist' was never an occupation (0 wills; 'Chymist' 40): use Chymist. Status words (Gentleman, Yeoman, Captain) sat in the same slot as trades. Grey chips are STATS.md skills with no goods tree. Source: research-occupations.md. Metal trades: six London companies back the split (research-metal-trades.md); whitesmith found no evidence and is not a skill; locksmith, farrier, nailer and anchorsmith fold into Blacksmithing on Campbell's word. Medical trades: Campbell's five 'Professors' back the split; bonesetter, tooth-drawer and quack were empirics, not trades, and fold into Surgery's tiers; Black healers and obeah are in the secondary literature only (open).", "rules": ["one word per character by default; the word of their highest skill group", "a second word for a few: sea + craft ('Mariner and Cooper'), or 'Merchant, Commander'; 'Barber-Chirurgeon' is one compound trade", "status words are not occupations: Gentleman, Esquire, Yeoman, Husbandman, Captain/Colonel (militia), Servant, Labourer; they can sit beside a trade word", "no bonus from the label itself; any synergy comes from the skills (Rex: later, if at all)"], "list": [{"name": "Planter", "period": "trade-cum-status; 'Planter of Saint James, Barbados' (1670)", "skills": ["Farming", "Sugar boiling", "Distilling", "Animal Husbandry", "Brewing"], "note": "The sugar planter's works: fields, boiling house, still-house (L). Boiler and distiller as job titles: open for 1657"}, {"name": "Husbandman", "period": "status of a small farmer, used as a trade in indentures (1654–86)", "skills": ["Farming", "Animal Husbandry", "Dairying"], "note": "Rex's 'Agriculturalist'. Yeoman is the richer man, same work"}, {"name": "Hunter (boucanier)", "period": "Exquemelin: Hispaniola's three callings, 'hunt, plant, pirate' (1684)", "skills": ["Hunting", "Butchering", "Preserving", "Tanning"], "note": "the boucan is Preserving"}, {"name": "Fisherman / Turtler", "period": "turtlers in sloops at the Caymans (D)", "skills": ["Fishing", "Marine Gathering", "Swimming"], "outside": ["Swimming"], "note": "salt-rakers and pearl-divers fall here; no will title found for either (open)"}, {"name": "Woodcutter (logwood-cutter, collier)", "period": "the Campeche cutters (D); collier for charcoal", "skills": ["Woodcutting"], "note": "no will title found; the cutters were 'Jamaica men' by origin, not trade (open)"}, {"name": "Miner / Refiner", "period": "off-map in this period (Spanish silver, European iron)", "skills": ["Mining", "Chemical Refining"], "note": "a label the Caribbean town will rarely use"}, {"name": "Victualler / Cook", "period": "'Victualler' (Bristol 1694; Spalding 1642); the ship's Cook among the exempted tradesmen (Smith 1627)", "skills": ["Cooking", "Baking", "Butchering", "Preserving", "Milling"], "note": "Rex's 'Food Artisan'. Miller, Baker and Butcher were each a trade of their own in a town; a small port lumps them"}, {"name": "Chandler", "period": "'Tallow chandler' (Spalding 1642)", "skills": ["Waxworking"], "note": "the INFP's calling; wax figures are a design extension"}, {"name": "Tanner / Currier", "period": "'Tanners, Curriors, Shoemakers' at Port Royal 1688 (Taylor)", "skills": ["Tanning", "Leatherworking"], "note": "the currier dressed the tanned hide; folded into Tanning here"}, {"name": "Cordwainer", "period": "'Cordwainer' (Spalding 1642; indentures); 'Shoemakers' at Port Royal 1688", "skills": ["Shoemaking"], "note": ""}, {"name": "Sugar-baker", "period": "'Sugar Baker' (Exeter 1661), 'Sugar Refiner' (London 1694)", "skills": ["Sugar boiling"], "note": "in England the refiner; on the island the boiler. One label for both"}, {"name": "Brewer", "period": "Brewers' Company 1438; colonial breweries Massachusetts 1637, Virginia 1652; the Navy's contract brewers (1678)", "skills": ["Brewing"], "note": "Port Royal brewhouse: open"}, {"name": "Distiller", "period": "'Distiller' (London 1692; Distillers' Company 1638)", "skills": ["Distilling"], "note": ""}, {"name": "Vintner / Taverner", "period": "'Vintner' (Nevis 1723, Bridgetown 1679/80); Strype 1720: the vintner imports wine, the taverner retails it; Barbados capped tavern prices (1672)", "skills": ["Haggling", "Cooking"], "outside": ["Haggling"], "note": "the punch-house keeper; sells, does not make"}, {"name": "Dyer", "period": "a London company trade; no Caribbean will title found (open)", "skills": ["Dye Making"], "note": "indigo-making on the plantation was planter's work under an overseer (D)"}, {"name": "Perfumer", "period": "no period Caribbean source (Rex's addition)", "skills": ["Perfumery"], "note": "unsourced"}, {"name": "Chymist", "period": "'Chymist' (Southwark 1728), 'Chemist and Apothecary' (1729); never 'Alchymist'", "skills": ["Chemical Refining", "Apothecary", "Distilling", "Dye Making", "Powder Making"], "note": "Rex's 'Alchemist' y of Apothecaries 1617; could prescribe after the Rose case (1703/04). Ligon's plantation 'Doctor'. The INTJ's calling"}, {"name": "Physician (Doctor in Physic)", "period": "'Doctor in Physic' (Port Royal 1725); College of Physicians 1518; Campbell's first 'Professor' of the medical trades", "skills": ["Physic (the physician)", "Apothecary"], "note": "a learned status as much as a trade; rare in the colonies"}, {"name": "Druggist", "period": "Campbell 1747: 'to buy up, in large Quantities, all manner of uncompounded Drugs'; a weekly printed bill gave drug prices", "skills": ["Haggling", "Apothecary"], "outside": ["Haggling"], "note": "a merchant of drugs, not a maker; the shopkeeping kind"}, {"name": "Midwife", "period": "licensed by the diocesan bishop, c. 1500–18th c.; an 'unofficial apprenticeship' (Evenden)", "skills": ["Surgery (Surgery and medicine)"], "note": "a licensed calling with no skill of its own here: the game has no childbirth system (open for Rex)"}, {"name": "Mariner", "period": "the catch-all sea word in wills ('Mariner of Port Royal', 1683); Smith 1627 splits Sailers (able) from Younkers (foremast men)", "skills": ["Seamanship", "Climbing aloft", "Helmsmanship", "Navigation", "Lookout", "Swimming"], "outside": ["Seamanship", "Climbing aloft", "Helmsmanship", "Navigation", "Lookout", "Swimming"], "note": "Master and Mate are ranks inside it, not occupations"}, {"name": "Gunner", "period": "'Mariner and Gunner' (1667); Gunner among the ship's officers (Smith 1627)", "skills": ["Gunnery", "Powder Making"], "outside": ["Gunnery"], "note": "fires the guns; does not make the powder unless he also has that skill"}, {"name": "Soldier (marine, militia)", "period": "militia ranks 'Captain', 'Colonel' are status; the boarders in Roberts' articles", "skills": ["Swordplay", "Marksmanship", "Brawling", "Intimidation"], "outside": ["Swordplay", "Marksmanship", "Brawling", "Intimidation"], "note": "Rex's 'Military Specialist'. Combat classes are a later topic"}, {"name": "Merchant / Factor", "period": "the commonest Port Royal will word (19 of 100); 'Merchant, Commander' (1684)", "skills": ["Haggling", "Reading and writing", "Persuasion", "Deception"], "outside": ["Haggling", "Reading and writing", "Persuasion", "Deception"], "note": "Rex's 'Merchant / Diplomat'. Grocer, Vintner, Linen-draper, Ironmonger are the shopkeeping kinds"}, {"name": "Musician", "period": "'served as Musick' at the Cape Coast trial (J); musician by-employment at Spalding", "skills": ["Music"], "outside": ["Music"], "note": "usually a second word: three of Spalding's four musicians had another trade"}, {"name": "Gamester / Sharper", "period": "no will title (nobody wrote 'gamester' on a will); a reputation, not a trade", "skills": ["Gambling", "Sleight of hand", "Deception"], "outside": ["Gambling", "Sleight of hand", "Deception"], "note": "the den's people"}]}, "sources": {"metal": "research-metal-trades.md (shared notes): Campbell 1747, livery company charters, London Museum (Hounslow), QAR pewter, Museum of Miami on Port Royal", "wood": "research-wood-trades.md (shared notes): Campbell 1747, Carpenters' and Shipwrights' and Coopers' company histories, Ligon, Dampier 1705, Johnson", "medical": "research-medical-trades.md (shared notes): Campbell 1747, Society of Apothecaries, Ligon, Exquemelin, Johnson, QAR finds, the Williamsburg apothecary booklet", "spices": "research-spices-drinks.md (shared notes): CSP 1681 import return, Posthumus Amsterdam 1691–94, Blome 1672, Ligon, Dampier, Sloane via secondary, Navy victualling 1678/1731/1740, Bailey 1724, Johnson"}, "imported": {"note": "Goods no skill here makes in the period: they arrive in a European ship's cargo or a far-travelled merchant's (3f). They exist in the data as goods with no recipe.", "items": [{"good": 66, "name": "Pepper (black, white)", "knowledge": "foreign", "note": "white 1.01, black 0.42 guilders a lb at Amsterdam (1691–94); Lowther took 'pepper' from a prize (J)", "region": "malacca"}, {"good": 67, "name": "Cloves, nutmeg, mace, cinnamon", "knowledge": "foreign", "note": "Amsterdam 1691: cloves 3.75, nutmeg 3.00, mace 8.40, cinnamon 3.00 guilders a lb; Ligon's cookery used them", "region": "malacca"}, {"good": 68, "name": "Saffron", "knowledge": "foreign", "note": "21.50 guilders a lb at Amsterdam (1691): dearer than cochineal"}, {"good": 72, "name": "Peruvian bark (cinchona)", "knowledge": "foreign", "note": "Spanish Peru → Spain → London chemists (1658). Spanish mainland, not an expansion region", "region": "caribbean"}, {"good": 75, "name": "Tea", "knowledge": "foreign", "note": "Roberts 'drank his Tea constantly' (J); Asia by the Company ships", "region": "east-china-sea"}, {"good": 40, "name": "Madeira, Canary, sherry, claret (the wines)", "note": "Madeira shipped 8–9,000 pipes a year (Ovington 1696); the vintner imports, the taverner sells (Strype 1720)"}]}, "regions": {"note": "REGIONS.md: the four expansions confirmed by Rex 2026-10-29; tier is the proposed escalation order (1 easiest, 4 hardest), each raising the level cap", "list": [{"id": "caribbean", "name": "The Caribbean", "tier": 0, "leansOn": "the base game"}, {"id": "barbary", "name": "Barbary coast", "tier": 1, "leansOn": "ships, chase, ransom; morocco leather"}, {"id": "malacca", "name": "Malacca and the Spice Islands", "tier": 2, "leansOn": "spices, sago, trepang; kris; drugs and poisons; smuggling"}, {"id": "indian-ocean", "name": "Indian Ocean", "tier": 3, "leansOn": "wealth; wootz steel; calico and chintz; pearls; big ships"}, {"id": "east-china-sea", "name": "East China Sea", "tier": 4, "leansOn": "gunpowder and founding; porcelain; silk; junks; state navies"}]}, "build": "built 2026-10-29 00:59, 41 skills"}</script>
<script>
(function () {
  const data = JSON.parse(document.getElementById('data').textContent);
  const bands = data.bands;
  const main = document.getElementById('main');
  document.getElementById('status').textContent = (data.build ? data.build + ' · ' : '') + data.status;
  const bandsEl = document.getElementById('bands');
  for (const b of bands) {
    const d = document.createElement('div'); d.className = 'band-key';
    d.innerHTML = '<b>' + b.name + ' ' + b.range + '</b><span>' + b.period + '</span>';
    bandsEl.appendChild(d);
  }
  if (data.occupations) {
    const occ = document.createElement('section'); occ.className = 'group notree';
    occ.innerHTML = '<h2>Occupations</h2><p class="note">' + (data.occupations.note || '') + '</p>'
      + '<div class="occs">' + data.occupations.list.map(o =>
        '<div class="occ"><b>' + o.name + '</b>' + (o.period ? ' <span class="count">' + o.period + '</span>' : '')
        + '<div class="skills-of">' + o.skills.map(s => '<span class="chip' + (o.outside && o.outside.includes(s) ? ' off' : '') + '">' + s + '</span>').join(' ') + '</div>'
        + (o.note ? '<div class="count">' + o.note + '</div>' : '') + '</div>').join('') + '</div>';
    main.appendChild(occ);
  }
  const chips = [];
  const byKey = new Map();
  let total = 0, off = 0;
  for (const g of data.groups) {
    const sec = document.createElement('section'); sec.className = 'group ' + g.key;
    sec.innerHTML = '<h2>' + g.name + '</h2><p class="note">' + g.note + '</p>';
    for (const s of g.skills) {
      const card = document.createElement('div'); card.className = 'skill';
      card.innerHTML = '<h3>' + s.name + '<span class="tag">' + (s.existing ? 'in STATS.md' : 'new') + '</span></h3>'
        + '<div class="covers">' + s.covers + '</div><p class="why">' + s.why + '</p>';
      const tiers = document.createElement('div'); tiers.className = 'tiers';
      for (const b of bands) {
        const name = document.createElement('div'); name.className = 'tier-name'; name.textContent = b.name;
        const row = document.createElement('div'); row.className = 'tier-row ' + b.key;
        for (const it of s.items.filter(i => i.band === b.key)) {
          const c = document.createElement('button'); c.type = 'button';
          c.className = 'chip' + (it.offMap ? ' off' : '') + (it.unsourced ? ' unsourced' : '') + (it.service ? ' service' : '');
          c.innerHTML = it.name + '<span class="row">#' + it.good + '</span>';
          const key = s.key + ':' + it.name;
          c.dataset.key = key; it._skill = s; it._band = b;
          byKey.set(key, { it, c });
          c.addEventListener('click', () => select(key));
          row.appendChild(c); chips.push({ it, c }); total++; if (it.offMap) off++;
        }
        tiers.appendChild(name); tiers.appendChild(row);
      }
      card.appendChild(tiers); sec.appendChild(card);
    }
    main.appendChild(sec);
  }
  if (data.imported) {
    const im = document.createElement('section'); im.className = 'group notree';
    im.innerHTML = '<h2>Imported only</h2><p class="note">' + data.imported.note + '</p><ul>'
      + data.imported.items.map(n => '<li><b>' + n.name + '</b> <span class="count">#' + n.good + (n.knowledge ? ' · ' + n.knowledge + ' knowledge' : '') + '</span>: ' + n.note + '</li>').join('') + '</ul>';
    main.appendChild(im);
  }
  const nt = document.createElement('section'); nt.className = 'group notree';
  nt.innerHTML = '<h2>No tree</h2><p class="note">Goods no skill makes in the game.</p><ul>'
    + data.noTree.map(n => '<li><b>' + n.name + '</b> <span class="count">#' + n.good + '</span>: ' + n.note + '</li>').join('') + '</ul>';
  main.appendChild(nt);
  document.getElementById('count').textContent = total + ' placements, ' + off + ' off-map, ' + data.noTree.length + ' without a tree';

  function inputsOf(it) { return (it.input ? [it.input] : []).concat(it.inputs || [], it.inputAny || []); }
  function up(key, acc) {
    if (acc.has(key)) return acc; acc.add(key);
    const e = byKey.get(key); if (e) for (const k of inputsOf(e.it)) up(k, acc);
    return acc;
  }
  function down(key, acc) {
    if (acc.has(key)) return acc; acc.add(key);
    for (const [k, v] of byKey) if (inputsOf(v.it).includes(key)) down(k, acc);
    return acc;
  }
  function chainOf(key, acc) { up(key, acc); return down(key, acc); }
  function select(key) {
    const e = byKey.get(key); if (!e) return;
    const it = e.it, s = it._skill, b = it._band;
    const inp = it.input ? byKey.get(it.input) : null;
    const label = k => { const e2 = byKey.get(k); return e2 ? e2.it._skill.name + ': ' + e2.it.name : k; };
    const any = (it.inputAny || []).map(label);
    const all = (it.inputs || []).map(label);
    const uses = [...byKey.values()].filter(v => inputsOf(v.it).includes(key)).map(v => v.it._skill.name + ': ' + v.it.name);
    document.getElementById('detail').innerHTML =
      '<b>' + it.name + '</b> <span class="muted">(GOODS.md row ' + it.good + ')</span> · ' + s.name + ', ' + b.name + ' ' + b.range
      + (it.offMap ? ' · <span class="muted">off-map in this period</span>' : '')
      + (it.gate ? ' · <span class="muted">gate:</span> ' + it.gate : '')
      + (it.unsourced ? ' · <span class="muted">unsourced (Rex\'s addition)</span>' : '')
      + (it.service ? ' · <span class="muted">a service, not a good</span>' : '')
      + (it.knowledge && it.knowledge !== 'common' ? ' · <span class="muted">' + it.knowledge + ' knowledge</span>' : '')
      + (it.region && it.region !== 'caribbean' ? ' · <span class="muted">region: ' + it.region + '</span>' : '')
      + '<br>' + it.note
      + (inp ? '<br><span class="muted">needs:</span> ' + inp.it._skill.name + ': ' + inp.it.name : (it.input ? '<br><span class="muted">needs:</span> ' + it.input : ''))
      + (all.length ? '<br><span class="muted">needs all of:</span> ' + all.join(', ') : '')
      + (any.length ? '<br><span class="muted">needs one of:</span> ' + any.join(' or ') : '')
      + (uses.length ? '<br><span class="muted">used by:</span> ' + uses.join('; ') : '');
    const chains = document.getElementById('showChains').checked;
    const lit = chains ? chainOf(key, new Set()) : new Set([key]);
    for (const { c } of chips) { c.classList.toggle('hit', lit.has(c.dataset.key)); c.classList.toggle('dim', chains && !lit.has(c.dataset.key)); }
  }
  document.getElementById('showOff').addEventListener('change', ev => {
    for (const { it, c } of chips) if (it.offMap) c.style.display = ev.target.checked ? '' : 'none';
  });
  document.getElementById('main').addEventListener('click', ev => {
    if (ev.target === main || ev.target.closest('.tier-row') === null && !ev.target.closest('.chip')) {
      for (const { c } of chips) { c.classList.remove('hit', 'dim'); }
    }
  });
})();
</script>
